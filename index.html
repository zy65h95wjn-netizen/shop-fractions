<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop Fractions</title>
<meta name="description" content="Fraction calculator that rounds up or down to the nearest 1/16.">
<meta name="theme-color" content="#0b0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fractions">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{margin:0;font-size:14px;touch-action:manipulation;overscroll-behavior:none}
[hidden]{display:none!important}
</style>
<style>
/* Layout: one dark screen. Readout, tape strip, Down/Up row, then a Whole/Decimal panel beside a
   Numerator-over-Denominator panel (blue bar between = fraction bar), operators along the bottom. */
:root{
  --bg:#0b0e13; --readout:#161b23; --panel:#11151b; --key:#1d232d; --key-hi:#232a35; --press:#303947;
  --fg:#f2f4f7; --muted:#8d96a3; --line:#262d38;
  --op:#4aa3ff; --sign-bg:#1c2738; --danger:#ff6b5e; --danger-bg:#3a1d1c; --danger-line:#532826;
  --tape:#f7cf3f; --tape-ink:#14130d; --mark:#c22a17;
  --cu-edge:#8a4a22; --cu:#c56c33; --cu-lite:#f8c8a0; --cu-dark:#64300f; --bore:#170d07;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:calc(100% + var(--short, 0px))}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%;background:var(--bg);color:var(--fg);font-family:var(--ui);
  padding-inline:16px;padding-block:14px;display:flex;justify-content:center;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.app{width:100%;max-width:440px;height:100%;min-height:600px;display:flex;flex-direction:column;gap:8px}

/* mode tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr auto;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
.tab{font-family:var(--ui);font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--muted);background:none;border:0;border-radius:7px;height:30px;padding:0;cursor:pointer;touch-action:manipulation}
.tab[aria-selected="true"]{background:var(--key-hi);color:var(--fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.tab:focus-visible{outline:2px solid var(--op);outline-offset:1px}
.ver{font-size:10px;color:var(--muted);padding:0 7px 0 5px;font-variant-numeric:tabular-nums}

/* readout */
.readout{background:var(--readout);border:1px solid var(--line);border-radius:12px;padding:8px 14px 10px;display:flex;flex-direction:column;gap:2px;flex:none}
.expr{min-height:19px;font-size:15px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.expr.err{color:var(--danger);font-weight:600}
.expr.warn{color:var(--tape);font-weight:600}
.main{font-weight:600;font-size:52px;line-height:58px;height:58px;text-align:right;white-space:nowrap;overflow:hidden;font-variant-numeric:lining-nums}
.main .neg{margin-right:.08em}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-size:.5em;line-height:1.08;vertical-align:middle;margin-left:.3em;position:relative;top:-.08em}
.fr span{padding:0 .22em;min-width:1.1em;text-align:center}
.fr span:first-child{border-bottom:2px solid currentColor}
.fr .ph{color:transparent;background:var(--key-hi);border-radius:4px}
.sub{min-height:18px;font-size:14px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tape{display:block;width:100%;height:auto;border-radius:8px;flex:none}
.tape text.sm{font-size:11px}
.tape text{font-family:var(--ui);font-weight:700;font-size:13px;fill:var(--tape-ink);paint-order:stroke;stroke:var(--tape);stroke-width:5px;stroke-linejoin:round}
.round{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.chip{
  font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:7px 12px 6px;display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:8px;text-align:left;cursor:pointer;min-width:0;
}
.chip .lab{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.chip .arr{color:var(--op);font-size:15px;font-weight:700;margin-right:3px}
.chip .off{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.chip .val{grid-column:1 / -1;font-size:20px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip[aria-pressed="true"]{background:var(--tape);border-color:var(--tape);color:var(--tape-ink)}
.chip[aria-pressed="true"] .lab,.chip[aria-pressed="true"] .off,.chip[aria-pressed="true"] .arr{color:var(--tape-ink)}
.chip:disabled{cursor:default}
.tape.tube{border-radius:0;cursor:pointer}
.tape.tube text{font-size:10px;font-weight:600;fill:var(--muted);stroke:none}
.tape.tube text.on{fill:var(--tape);font-weight:800;font-size:11px}
.main.walk{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bigno{background:var(--tape);color:var(--tape-ink);font-size:.64em;font-weight:700;min-width:1.75em;height:1.5em;line-height:1.5em;padding:0 .3em;border-radius:10px;text-align:center;font-variant-numeric:tabular-nums;flex:none}
.chip:disabled .val{color:var(--muted)}

/* key panels */
.pads{flex:1;min-height:0;display:grid;grid-template-columns:.95fr 1fr;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:0}
.plab{margin:0;display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:16px;padding-inline:3px;flex:none;white-space:nowrap}
.plab::after{content:"";flex:1;height:1px;background:var(--line)}
.plab.blue{color:var(--op)}
.whole{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:6px;min-height:0}
.pad{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:6px}
.bar{height:3px;border-radius:2px;background:var(--op);flex:none;margin-block:2px}
.ops{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;height:56px;flex:none}
.k{
  font-family:var(--ui);font-size:26px;font-weight:500;color:var(--fg);
  background:linear-gradient(var(--key-hi),var(--key));
  border:1px solid var(--line);border-radius:10px;min-height:0;padding:0;cursor:pointer;touch-action:manipulation;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;transition:transform .08s;
}
.pad .k{font-size:23px}
.k:active{background:var(--press);transform:scale(.96)}
.k.wide{grid-column:span 2}
.k.clear{color:var(--danger);background:var(--danger-bg);border-color:var(--danger-line);font-weight:600}
.k.sign{color:var(--op);background:var(--sign-bg);font-size:22px;font-weight:600}
.k.op{color:var(--op);font-size:32px;font-weight:400}
.k.eq{background:var(--tape);border-color:var(--tape);color:var(--tape-ink);font-size:34px;font-weight:600}
.k.eq:active{background:var(--tape);filter:brightness(.88)}
.k svg{width:26px;height:20px}
.k:disabled{opacity:.3;cursor:default}
.ops.xr{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
.k.go{background:var(--tape);border-color:var(--tape);color:var(--tape-ink);font-size:19px;font-weight:700;letter-spacing:.01em}
.k.go:active{background:var(--tape);filter:brightness(.88)}
.k.txt{font-size:17px;font-weight:600}

/* x-ray stamp list */
.list{flex:1;min-height:0}
.rows{list-style:none;margin:0;padding:0 2px;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.row{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;padding:4px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.row.done{opacity:.4}
.row.on{background:var(--key-hi);border-radius:9px;border-bottom-color:transparent;box-shadow:inset 0 0 0 1.5px var(--tape)}
.ops.xr.walk{grid-auto-flow:row;grid-template-columns:1fr 1.7fr}
.ops.sm{height:40px}
.ops.sm .k{font-size:15px}
.row:last-child{border-bottom:0}
.no{background:var(--tape);color:var(--tape-ink);font-weight:700;font-size:18px;border-radius:7px;height:31px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.pos{font-size:25px;font-weight:600;line-height:1.1;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.pos .in{color:var(--muted);font-weight:400;margin-left:1px}
.gap{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.k:focus-visible,.chip:focus-visible{outline:2px solid var(--op);outline-offset:2px}

/* scientific pad */
.sci{flex:1;min-height:0}
.sgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:6px}
.sgrid .k{font-size:17px;font-weight:500}
.sgrid .k.n{font-size:23px}
.sgrid .k.fn{color:var(--op)}
.sgrid .k.fn.alt{color:var(--tape)}
.sgrid .k.mod{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
.sgrid .k.mod.on{background:var(--tape);border-color:var(--tape);color:var(--tape-ink)}
.sgrid .k.ang{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--tape)}
.main .ghost{color:var(--muted);opacity:.55}
@media (max-height:660px){
  .main{font-size:42px;line-height:46px;height:46px}
  .k{font-size:23px}.pad .k{font-size:20px}.ops{height:48px}
}
@media (prefers-reduced-motion: reduce){.k{transition:none}.k:active{transform:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="tabs" aria-label="Mode">
    <button class="tab" id="tab-calc" type="button" data-mode="calc" aria-selected="true">Calculator</button>
    <button class="tab" id="tab-xray" type="button" data-mode="xray" aria-selected="false">X-ray layout</button>
    <button class="tab" id="tab-sci" type="button" data-mode="sci" aria-selected="false">Scientific</button>
    <span class="ver" id="ver"></span>
  </nav>
  <section class="readout" aria-label="Readout">
    <div class="expr" id="expr" aria-live="polite"></div>
    <div class="main" id="main" aria-live="polite">0</div>
    <div class="sub" id="sub">Rounds to the nearest 1/16 after =</div>
  </section>
  <svg class="tape" id="tape" viewBox="0 0 320 46" role="img" aria-label="Tape measure"></svg>
  <div class="round" id="round">
    <button class="chip" id="chip-down" type="button" data-round="down" aria-pressed="false" disabled></button>
    <button class="chip" id="chip-up" type="button" data-round="up" aria-pressed="false" disabled></button>
  </div>
  <div class="pads" id="pads">
    <section class="panel">
      <h2 class="plab">Whole / Decimal</h2>
      <div class="whole" id="pad-w"></div>
    </section>
    <section class="panel">
      <h2 class="plab blue">Numerator</h2>
      <div class="pad" id="pad-n"></div>
      <div class="bar" aria-hidden="true"></div>
      <h2 class="plab blue">Denominator</h2>
      <div class="pad" id="pad-d"></div>
    </section>
  </div>
  <section class="panel sci" id="sci" hidden>
    <div class="sgrid" id="sci-pad"></div>
  </section>
  <section class="panel list" id="xr-list" hidden>
    <h2 class="plab blue">Stamp · inches from the end · tap to jump</h2>
    <ol class="rows" id="xr-rows"></ol>
  </section>
  <div class="ops" id="ops"></div>
  <div class="ops xr" id="xr-ops" hidden></div>
  <div class="ops xr sm" id="xr-ops2" hidden></div>
</div>

<script>
(function(){
"use strict";
const VERSION = "v9";

/* iPhone home-screen apps lay the page out shorter than the screen (by about the status bar height),
   which leaves dead space at the bottom. Measure the shortfall and stretch the page to cover it. */
function fixHeight(){
  let d = 0;
  try {
    if (window.navigator.standalone === true && window.matchMedia("(orientation: portrait)").matches) {
      const short = window.screen.height - document.documentElement.clientHeight;
      if (short > 0 && short < 140) d = short;
    }
  } catch (e) {}
  document.documentElement.style.setProperty("--short", d + "px");
}
fixHeight();
window.addEventListener("resize", fixHeight);
window.addEventListener("orientationchange", function(){ setTimeout(fixHeight, 300); });
window.addEventListener("pageshow", fixHeight);
const RD = 16n; // rounding grid: 16ths

/* ---------- exact fraction math (BigInt) ---------- */
const abs = a => a < 0n ? -a : a;
function gcd(a, b){ a = abs(a); b = abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
function F(n, d){
  if (d === 0n) throw new Error("div0");
  if (d < 0n) { n = -n; d = -d; }
  const g = gcd(n, d) || 1n;
  return { n: n / g, d: d / g };
}
const OPS = {
  "+": (a, b) => F(a.n * b.d + b.n * a.d, a.d * b.d),
  "−": (a, b) => F(a.n * b.d - b.n * a.d, a.d * b.d),
  "×": (a, b) => F(a.n * b.n, a.d * b.d),
  "÷": (a, b) => F(a.n * b.d, a.d * b.n)
};
function floorDiv(n, d){ let q = n / d; if (n % d !== 0n && n < 0n) q -= 1n; return q; }
function ceilDiv(n, d){ return -floorDiv(-n, d); }
function onGrid(f){ return (f.n * RD) % f.d === 0n; }
function roundTo(f, dir){
  const q = floorDiv(f.n * RD, f.d);
  return F(dir === "up" && !onGrid(f) ? q + 1n : q, RD);
}
function parts(f){ const a = abs(f.n); return { neg: f.n < 0n, w: a / f.d, n: a % f.d, d: f.d }; }
function txt(f){
  const p = parts(f);
  const s = p.n ? (p.w ? p.w + " " : "") + p.n + "/" + p.d : "" + p.w;
  return (p.neg ? "−" : "") + s;
}
function html(f){
  const p = parts(f);
  return (p.neg ? '<span class="neg">−</span>' : "") + (p.w || !p.n ? p.w : "") +
    (p.n ? '<span class="fr"><span>' + p.n + "</span><span>" + p.d + "</span></span>" : "");
}
function dec(f, places){
  const v = Number(f.n) / Number(f.d);
  return (+v.toFixed(places)).toString().replace("-", "−");
}
function evaluate(t){ // × and ÷ before + and −
  const vals = [t[0].f], pend = [];
  for (let i = 1; i < t.length; i += 2) {
    const o = t[i], v = t[i + 1].f;
    if (o === "×" || o === "÷") vals.push(OPS[o](vals.pop(), v));
    else { pend.push(o); vals.push(v); }
  }
  let r = vals[0];
  pend.forEach((o, i) => { r = OPS[o](r, vals[i + 1]); });
  return r;
}

/* ---------- x-ray stamp layout ----------
   Stamp 0 sits END inches in, the last stamp END inches from the far end. The span between is cut into
   the fewest equal shots that are MIN_SHOT..MAX_SHOT long. Each stamp location is rounded to the nearest
   1/16, mirrored from both ends, so shots differ by at most 1/16 and the last stamp lands on the mark. */
const MIN_SHOT = 12n, MAX_SHOT = 13n, END = 1n, MAX_LEN = 1200n;
// When no count fits MIN_SHOT..MAX_SHOT, one fewer shot is allowed as long as each stays at or under this (13 3/8).
const OVER_MAX = F(107n, 8n);
function layout(L){
  if (L.n > MAX_LEN * L.d) throw "Too long. Max is " + MAX_LEN + " in";
  const span = OPS["−"](L, F(2n * END, 1n));
  const tooShort = "Too short for a " + MIN_SHOT + " in shot";
  if (span.n <= 0n) throw tooShort;
  let nMin = ceilDiv(span.n, span.d * MAX_SHOT), over = false;
  const nMax = floorDiv(span.n, span.d * MIN_SHOT);
  if (nMin > nMax && nMax >= 1n && span.n * OVER_MAX.d <= OVER_MAX.n * span.d * nMax) { nMin = nMax; over = true; }
  if (nMin > nMax) {
    // No count gives equal shots inside the limits. Report the count on each side (text after "|" is the hint line).
    if (nMax < 1n) throw tooShort;
    const each = function(n){ return txt(F(floorDiv(2n * span.n * RD + span.d * n, 2n * span.d * n), RD)); };
    throw "No equal split between " + MIN_SHOT + " and " + MAX_SHOT + "|" + nMax + (nMax === 1n ? " shot" : " shots") +
      " would be " + each(nMax) + " each, " + nMin + " would be " + each(nMin);
  }
  const N = Number(nMin), b = span.d * nMin, first = RD * END, pos = [];
  for (let k = 0; k <= N; k++) pos.push(first + floorDiv(2n * BigInt(k) * RD * span.n + b, 2n * b));
  if ((span.n * RD) % span.d === 0n) {
    const T = span.n * RD / span.d;
    for (let k = Math.floor(N / 2) + 1; k <= N; k++) pos[k] = first + T - (pos[N - k] - first);
  }
  let lo = pos[1] - pos[0], hi = lo;
  const gaps = [];
  for (let k = 1; k <= N; k++) { const g = pos[k] - pos[k - 1]; gaps.push(F(g, RD)); if (g < lo) lo = g; if (g > hi) hi = g; }
  return { length: L, shots: N, stamps: pos.map(p => F(p, RD)), gaps: gaps, minGap: F(lo, RD), maxGap: F(hi, RD), over: over };
}

/* ---------- state ---------- */
const blank = () => ({ w: "", n: "", d: "", neg: false });
const has = e => !!(e.w || e.n || e.d);
let entry = blank(), tokens = [], exact = null, picked = null, lastExpr = "", msg = "";
let mode = "calc", xEntry = blank(), xRes = null, xSel = 0, tubeXs = [], xHint = "";
try { const m = localStorage.getItem("sf-mode"); if (m === "xray" || m === "sci") mode = m; } catch (e) {}
const cur = () => picked ? roundTo(exact, picked) : exact;

/* ---------- scientific ----------
   Expression is a token list: num, c (π e Ans), fn (always followed by "("), "(", ")", op (+ − × ÷ ^), post (² ³ ⁻¹).
   Math is floating point; the result is cleaned to 12 significant digits, then turned into a fraction
   (to the millionth) so the Down/Up chips and the tape can round it to a 16th like the main calculator. */
const S = { t: [], done: false, res: null, ex: null, pk: null, expr: "", ans: null, deg: true, sh: false };
try { if (localStorage.getItem("sf-angle") === "rad") S.deg = false; } catch (e) {}
const SYN = "Check the expression";
const FN_LABEL = { sin: "sin", cos: "cos", tan: "tan", asin: "sin⁻¹", acos: "cos⁻¹", atan: "tan⁻¹",
  ln: "ln", log: "log", sqrt: "√", cbrt: "∛", exp: "e^", p10: "10^" };
const sLast = () => S.t[S.t.length - 1];
function sWantsOperand(){ const l = sLast(); return !l || l.k === "op" || l.k === "(" || l.k === "fn"; }
function sEndsOperand(){ const l = sLast(); return !!l && (l.k === "num" || l.k === "c" || l.k === ")" || l.k === "post"); }
function sOpen(t){ let n = 0; t.forEach(x => { if (x.k === "(") n++; else if (x.k === ")") n--; }); return n; }
function sFn(name, x){
  const R = S.deg ? Math.PI / 180 : 1;
  switch (name) {
    case "sin": return S.deg && x % 180 === 0 ? 0 : Math.sin(x * R);
    case "cos": return S.deg && (x - 90) % 180 === 0 ? 0 : Math.cos(x * R);
    case "tan":
      if (S.deg && x % 180 === 0) return 0;
      if (S.deg && (x - 90) % 180 === 0) throw "tan of " + x + "° is undefined";
      return Math.tan(x * R);
    case "asin": if (Math.abs(x) > 1) throw "sin⁻¹ needs −1 to 1"; return Math.asin(x) / R;
    case "acos": if (Math.abs(x) > 1) throw "cos⁻¹ needs −1 to 1"; return Math.acos(x) / R;
    case "atan": return Math.atan(x) / R;
    case "ln": if (x <= 0) throw "ln needs a number above 0"; return Math.log(x);
    case "log": if (x <= 0) throw "log needs a number above 0"; return Math.log10(x);
    case "sqrt": if (x < 0) throw "Can't take √ of a negative"; return Math.sqrt(x);
    case "cbrt": return Math.cbrt(x);
    case "exp": return Math.exp(x);
    case "p10": return Math.pow(10, x);
  }
  throw SYN;
}
function sEval(t){
  let i = 0;
  const peek = () => t[i];
  const isOp = (p, s) => p && p.k === "op" && s.includes(p.s);
  function expr(){
    let v = term();
    while (isOp(peek(), "+−")) { const o = t[i++].s, r = term(); v = o === "+" ? v + r : v - r; }
    return v;
  }
  function term(){
    let v = unary();
    for (;;) {
      const p = peek();

  exprEl.classList.toggle("err", !!msg);

    const grid = onGrid(exact);
    mainEl.innerHTML = html(cur());
    subEl.textContent = picked
      ? "Rounded " + picked + " to 1/16 · exact " + txt(exact) + " (" + dec(exact, 4) + ")"
      : (grid ? "Lands on a 16th · " : "Exact · ") + dec(exact, 4);
    for (const dir of ["down", "up"]) {
      chips[dir].innerHTML = chipHTML(dir, exact);
      chips[dir].disabled = grid;
      chips[dir].setAttribute("aria-pressed", String(picked === dir));
    }
    drawTape(exact);
  } else {
    mainEl.innerHTML = entryHTML(entry);
    subEl.textContent = has(entry) || tokens.length ? " " : "Rounds to the nearest 1/16 after =";
    for (const dir of ["down", "up"]) {
      chips[dir].innerHTML = chipHTML(dir, null);
      chips[dir].disabled = true;
      chips[dir].setAttribute("aria-pressed", "false");
    }
    drawTape(null);
  }
  fit();
}

/* ---------- keys ---------- */
const BACK = '<svg viewBox="0 0 28 22" aria-hidden="true"><path d="M9 1h17a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H9L1 11Z" fill="currentColor" opacity=".85"/><path d="M13 7l8 8M21 7l-8 8" stroke="var(--key)" stroke-width="2.4" stroke-linecap="round"/></svg>';
function key(id, cls, label, attrs, aria){
  return '<button type="button" class="k ' + cls + '" id="' + id + '" ' + attrs + (aria ? ' aria-label="' + aria + '"' : "") + ">" + label + "</button>";
}
function numKey(pad, k, cls){
  const names = { w: "whole", n: "top", d: "bottom" };
  const label = k === "back" ? BACK : k;
  const aria = k === "back" ? "Delete " + names[pad] + " digit" : names[pad] + " " + (k === "." ? "decimal point" : k);
  return key("k-" + pad + "-" + (k === "." ? "dot" : k), cls || "", label, 'data-pad="' + pad + '" data-key="' + k + '"', aria);
}
$("pad-w").innerHTML =
  key("k-clear", "clear", "C", 'data-act="clear"', "Clear") +
  key("k-sign", "sign", "+/−", 'data-act="sign"', "Change sign") +
  ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", ".", "back"].map(k => numKey("w", k)).join("");
for (const pad of ["n", "d"]) {
  $("pad-" + pad).innerHTML =
    ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"].map(k => numKey(pad, k)).join("") + numKey(pad, "back", "wide");
}
$("ops").innerHTML =
  [["+", "plus", "Add"], ["−", "minus", "Subtract"], ["×", "times", "Multiply"], ["÷", "divide", "Divide"]]
    .map(o => key("k-op-" + o[1], "op", o[0], 'data-op="' + o[0] + '"', o[2])).join("") +
  key("k-eq", "eq", "=", 'data-act="eq"', "Equals");

// Scientific pad, 5 columns. [action, label, class, aria] — "w" in class = spans 2 columns.
$("sci-pad").innerHTML = [
  ["2nd", "2nd", "mod", "Second functions"], ["angle", "DEG", "ang", "Degrees or radians"], ["pi", "π", "fn", "Pi"], ["clear", "C", "clear w", "Clear"],
  ["sin", "sin", "fn", "Sine"], ["cos", "cos", "fn", "Cosine"], ["tan", "tan", "fn", "Tangent"], ["ln", "ln", "fn", "Natural log"], ["log", "log", "fn", "Log base 10"],
  ["sq", "x²", "fn", "Square"], ["sqrt", "√", "fn", "Square root"], ["pow", "xʸ", "fn", "Power"], ["recip", "1/x", "fn", "Reciprocal"], ["e", "e", "fn", "e"],
  ["7", "7", "n"], ["8", "8", "n"], ["9", "9", "n"], ["(", "(", "fn", "Open bracket"], [")", ")", "fn", "Close bracket"],
  ["4", "4", "n"], ["5", "5", "n"], ["6", "6", "n"], ["back", BACK, "w", "Delete"],
  ["1", "1", "n"], ["2", "2", "n"], ["3", "3", "n"], ["neg", "+/−", "sign w", "Change sign"],
  ["0", "0", "n w"], [".", ".", "n", "Decimal point"], ["ans", "Ans", "fn w", "Last answer"]
].map(function(k){
  const id = "s-" + ({ "(": "lp", ")": "rp", ".": "dot" }[k[0]] || k[0]);
  return key(id, k[2].replace(/\bw\b/, "wide"), k[1], 'data-sci="' + k[0] + '"', k[3] || k[0]);
}).join("");

xopsEl.innerHTML =
  key("k-xr-go", "go", "Lay out stamps", 'data-act="xr-go"') +
  key("k-xr-back", "txt", "Back", 'data-act="xr-back"') +
  key("k-xr-next", "go", "Next stamp", 'data-act="xr-next"');
xops2El.innerHTML =
  key("k-xr-edit", "txt", "Edit length", 'data-act="xr-edit"') +
  key("k-xr-new", "txt", "New tube", 'data-act="xr-new"');

rowsEl.addEventListener("click", function(ev){
  const li = ev.target.closest("li[data-k]");
  if (!li || !xRes) return;
  xSel = Number(li.dataset.k); msg = ""; render();
});
tapeEl.addEventListener("click", function(ev){
  if (mode !== "xray" || !xRes || !tubeXs.length) return;
  const r = tapeEl.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * 320;
  let best = 0;
  tubeXs.forEach(function(v, k){ if (Math.abs(v - x) < Math.abs(tubeXs[best] - x)) best = k; });
  xSel = best; msg = ""; render();
});
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "visible") setWake(mode === "xray" && !!xRes);
});

$("app").addEventListener("click", function(ev){
  const b = ev.target.closest("button");
  if (!b || b.disabled) return;
  msg = ""; xHint = "";
  try {
    if (b.dataset.mode) { mode = b.dataset.mode; try { localStorage.setItem("sf-mode", mode); } catch (e) {} }
    else if (b.dataset.act === "xr-go") xrGo();
    else if (b.dataset.act === "xr-edit") xRes = null;
    else if (b.dataset.act === "xr-back") { if (xRes && xSel > 0) xSel--; }
    else if (b.dataset.act === "xr-next") { if (xRes && xSel < xRes.shots) xSel++; }
    else if (b.dataset.act === "xr-new") { xRes = null; xEntry = blank(); }
    else if (b.dataset.sci) sciKey(b.dataset.sci);
    else if (b.dataset.pad) digit(b.dataset.pad, b.dataset.key);
    else if (b.dataset.op) { if (mode === "sci") { S.sh = false; sOp(b.dataset.op); } else op(b.dataset.op); }
    else if (b.dataset.round) { if (mode === "sci") sPick(b.dataset.round); else picked = picked === b.dataset.round ? null : b.dataset.round; }
    else if (b.dataset.act === "clear") clearAll();
    else if (b.dataset.act === "sign") { if (mode === "calc") sign(); }
    else if (b.dataset.act === "eq") { if (mode === "sci") { S.sh = false; sEq(); } else equals(); }
  } catch (e) {
    if (typeof e === "string") { const parts = e.split("|"); msg = parts[0]; xHint = parts[1] || ""; } else throw e;
  }
  render();
});
window.shopFractions = { layout: layout, F: F, version: VERSION, sci: S, sEval: sEval };
render();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  var hadController = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      document.addEventListener("visibilitychange", function(){
        if (document.visibilityState === "visible") reg.update().catch(function(){});
      });
    }).catch(function(){});
  });
}
</script>
