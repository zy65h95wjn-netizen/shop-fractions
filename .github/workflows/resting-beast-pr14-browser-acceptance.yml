# Isolated PR #14 browser acceptance. This workflow is not intended for main.
name: Resting Beast PR14 browser acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  browser-acceptance:
    if: github.head_ref == 'qa/resting-beast-pr14-browser-acceptance'
    name: ${{ matrix.browser }} / 320-390-430px
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      NODE_PATH: ${{ runner.temp }}/pr14-playwright/node_modules
      CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ runner.temp }}/pr14-playwright/node_modules
      HISTORY_REVIEW_OUTPUT: ${{ runner.temp }}/pr14-history-${{ matrix.browser }}
      HISTORY_BROWSER: ${{ matrix.browser }}
      CI: 'true'
    steps:
      - name: Checkout exact PR14 release candidate (including base history)
        uses: actions/checkout@v6
        with:
          ref: 1f079c128d3e91bcb6e1958153dfa51065bb5a99
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm test target
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "1f079c128d3e91bcb6e1958153dfa51065bb5a99"
          git cat-file -e f64a4c0ebd565e0f2d1eb818b44213f4d4920a25:pulse/index.html
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install isolated Playwright and browser
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/pr14-playwright"
          npm --prefix "${RUNNER_TEMP}/pr14-playwright" install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
          "${RUNNER_TEMP}/pr14-playwright/node_modules/.bin/playwright" install --with-deps "${{ matrix.browser }}"
      - name: Run History Explorer browser acceptance
        id: history
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/pr14-logs-${{ matrix.browser }}"
          node pulse/tests/history_browser.js 2>&1 | tee "${RUNNER_TEMP}/pr14-logs-${{ matrix.browser }}/history.log"
      - name: Run frontend reliability browser acceptance
        id: reliability
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/pr14-logs-${{ matrix.browser }}"
          node pulse/tests/reliability_browser.js "${{ matrix.browser }}" 2>&1 | tee "${RUNNER_TEMP}/pr14-logs-${{ matrix.browser }}/reliability.log"
      - name: Upload synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: resting-beast-pr14-${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/pr14-history-${{ matrix.browser }}/
            ${{ runner.temp }}/pr14-logs-${{ matrix.browser }}/
      - name: Mark acceptance failure if either browser suite fails
        if: always() && (steps.history.outcome == 'failure' || steps.reliability.outcome == 'failure')
        run: exit 1
