name: Refresh sprite catalog
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_sprites.py
      - scripts/test_sync_sprites.py
      - island/data/sprite-details.json
      - .github/workflows/sprite-catalog.yml
permissions:
  contents: write
concurrency:
  group: sprite-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Test preservation and validation
        run: python3 -m unittest discover -s scripts -p 'test_sync_sprites.py'
      - name: Fetch and validate current released sprites
        run: python3 scripts/sync_sprites.py
      - name: Save validated catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add island/data/sprites.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified sprite release catalog'
            git push origin HEAD:main
          fi
