<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#0c1414" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Peach Physics · Elf Lab</title>
<meta name="description" content="A very serious interactive elf physics experiment. Tap, drag and flick. Three elves, six spring zones." />
<meta name="apple-mobile-web-app-title" content="Peach Physics" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" type="image/svg+xml" href="./icon.svg" />
<style>
:root{color-scheme:dark;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;--pine:#111f1d;--line:rgba(255,255,255,.115);--dim:#9eadaa;--gold:#e7c28d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0b1313;color:#f3f2e9}
body{background:radial-gradient(circle at 10% 5%,#263e35 0,transparent 44%),radial-gradient(circle at 100% 60%,#3c211f 0,transparent 44%),#0b1213;overscroll-behavior-y:contain}
main{max-width:620px;min-height:100dvh;margin:auto;padding:clamp(12px,2.6vw,20px);padding-top:max(15px,env(safe-area-inset-top));padding-bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:800}
h1{font-size:clamp(22px,5.5vw,30px);margin:2px 0 0;line-height:1.13;letter-spacing:-.045em;font-weight:760}
.beta{font-size:11px;color:#c8dacb;padding:6px 9px;border:1px solid #456056;border-radius:100px;background:#192b26;white-space:nowrap}
.sub{font-size:12px;margin:0;color:var(--dim);line-height:1.4}
#frame{width:100%;max-width:540px;margin:0 auto;position:relative;aspect-ratio:1214/1295;overflow:hidden;isolation:isolate;border:1px solid rgba(255,255,255,.28);border-radius:19px;box-shadow:0 15px 45px rgba(0,0,0,.4),0 0 0 5px rgba(255,255,255,.025);background:#121111;touch-action:none;user-select:none;-webkit-user-select:none}
#game{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#game:active{cursor:grabbing}
.corner-label{position:absolute;top:12px;left:12px;background:rgba(6,13,12,.69);color:rgba(255,255,255,.9);border:1px solid #ffffff28;backdrop-filter:blur(6px);padding:7px 10px;border-radius:20px;font-size:11px;font-weight:750;letter-spacing:.055em;pointer-events:none}
.touch-ring{position:absolute;width:34px;height:34px;pointer-events:none;border:1.5px solid rgba(255,229,193,.95);border-radius:50%;box-shadow:0 0 15px #ffd69d66,inset 0 0 6px #ffe4ac44;transform:translate(-50%,-50%) scale(.4);opacity:0;transition:opacity .23s,transform .23s}
.touch-ring.show{transform:translate(-50%,-50%) scale(1.15);opacity:.9;transition:none}
.panel{width:100%;max-width:540px;margin:0 auto;background:linear-gradient(145deg,rgba(32,49,44,.86),rgba(24,30,29,.92));border:1px solid var(--line);border-radius:18px;padding:13px 15px 14px;box-shadow:0 8px 30px #0002}
.action{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:14px}
button{appearance:none;border-radius:12px;font:inherit;font-weight:750;border:1px solid var(--line);min-height:42px;padding:10px 13px;color:#f5f1e5;cursor:pointer;touch-action:manipulation;transition:filter .12s,transform .12s}
button:active{transform:scale(.97)}
.primary{background:linear-gradient(135deg,#eacc9c,#bc815a);color:#221d1a;border:0;box-shadow:0 5px 18px #daa46b25;font-size:14px}
.secondary{background:#ffffff0b;font-size:13px}
.knobs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.control{min-width:0}
.control label{display:flex;justify-content:space-between;gap:2px;margin-bottom:9px;font-size:11px;font-weight:700;letter-spacing:.01em;color:#cddbd3}
.control output{color:var(--gold);font-variant-numeric:tabular-nums}
input[type=range]{display:block;width:100%;height:18px;margin:0;accent-color:#efbe83;cursor:pointer;touch-action:pan-x}
.foot{display:flex;align-items:start;justify-content:space-between;gap:10px;max-width:540px;margin:0 auto;width:100%;color:var(--dim);font-size:11px;line-height:1.4}
.foot strong{color:#d7d8c5}
#status{font-size:11px;color:#e7c28d;min-height:12px;text-align:right;white-space:nowrap}
.share-btn{display:inline-block;border:1px solid #5b6d5e;border-radius:6px;min-height:28px;padding:4px 8px;margin-top:4px;background:#26382f;color:#f4d7ae;font-size:11px;box-shadow:none;vertical-align:middle}
@media (max-width:380px){main{gap:10px;padding-inline:10px}.knobs{gap:10px}.panel{padding:10px 12px}.corner-label{font-size:10px}}
@media (max-height:740px){main{gap:8px}.panel{padding:10px 12px}.action{margin-bottom:10px}#frame{width:min(100%,calc((100dvh - 255px) * 1214 / 1295))}}
@media (prefers-reduced-motion:reduce){button{transition:none}.touch-ring{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><div class="eyebrow">The very serious science department</div><h1>Peach Physics <span aria-hidden="true">🍑</span></h1></div>
    <div class="beta">EXPERIMENT · 01</div>
  </div>
  <p class="sub">Three elves. Six independent spring zones. Tap, drag, or flick to test the physics.</p>
  <div id="frame">
    <canvas id="game" aria-label="Interactive photograph of three adult fantasy elves. Touch the picture for a localized spring effect."></canvas>
    <span class="corner-label">TOUCH TO JIGGLE</span>
    <div id="ring" class="touch-ring"></div>
  </div>
  <section class="panel" aria-label="Physics settings">
    <div class="action">
      <button id="bounce" type="button" class="primary">✦ Bounce all three</button>
      <button id="reset" type="button" class="secondary">↻ Reset</button>
    </div>
    <div class="knobs">
      <div class="control"><label for="strength">Bounce <output id="strengthValue">60</output></label><input id="strength" type="range" min="0" max="100" value="60" /></div>
      <div class="control"><label for="softness">Softness <output id="softnessValue">65</output></label><input id="softness" type="range" min="0" max="100" value="65" /></div>
      <div class="control"><label for="settle">Settle <output id="settleValue">45</output></label><input id="settle" type="range" min="0" max="100" value="45" /></div>
    </div>
  </section>
  <div class="foot"><div><strong>Peach Physics</strong> · No tracking, no external libraries. <button id="share" type="button" class="share-btn">Share with friends</button></div><div id="status" aria-live="polite">Loading image…</div></div>
</main>

     m.save();m.scale(sw/2,sh/2);
     const grad=m.createRadialGradient(1,1,0,1,1,1);
     grad.addColorStop(0,'rgba(0,0,0,1)');
     grad.addColorStop(.52,'rgba(0,0,0,1)');
     grad.addColorStop(.82,'rgba(0,0,0,.82)');
     grad.addColorStop(1,'rgba(0,0,0,0)');
     m.fillStyle=grad;m.fillRect(0,0,2,2);m.restore();
     return {buff,mask,ctx:buff.getContext('2d')};
   });
 }
 function drawFallback(){
   if(!ctx2d)return;
   ctx2d.clearRect(0,0,cvs.width,cvs.height);
   ctx2d.drawImage(img,0,0,cvs.width,cvs.height);
   const sx=cvs.width/W,sy=cvs.height/H;
   // Layer moving source fragments with feathered edges; no hard crop seams.
   for(let i=0;i<targets.length;i++){
     const p=targets[i];if(Math.abs(p.dx)+Math.abs(p.dy)<.000025)continue;
     const {buff,mask,ctx}=patchMasks[i];
     ctx.clearRect(0,0,buff.width,buff.height);
     const sourceX=p.x-p.rx-p.dx*W,sourceY=p.y-p.ry-p.dy*H;
     ctx.drawImage(img,sourceX,sourceY,2*p.rx,2*p.ry,0,0,buff.width,buff.height);
     ctx.globalCompositeOperation='destination-in';ctx.drawImage(mask,0,0);
     ctx.globalCompositeOperation='source-over';
     ctx2d.drawImage(buff,(p.x-p.rx)*sx,(p.y-p.ry)*sy);
   }
 }
 function draw(){
  if(needsResize)resize();
  if(fallback){drawFallback();return;}
  gl.useProgram(shader);
  gl.uniform4fv(motionLoc,new Float32Array(targets.flatMap(p=>[p.dx,p.dy,p.rip,0])));
  gl.uniform1f(tLoc,model.t);
  gl.drawArrays(gl.TRIANGLES,0,6);
 }
 function simulate(dt){
  // A mass-and-spring approximation; all units normalized by image size.
  const k=clamp(115-model.softness*.71,44,115);
  const damp=3.0+model.settle*.095;
  for(const p of targets){
    p.vx+=(-k*p.dx-damp*p.vx)*dt;
    p.vy+=(-k*p.dy-damp*p.vy)*dt;
    p.dx=clamp(p.dx+p.vx*dt,-.041,.041);
    p.dy=clamp(p.dy+p.vy*dt,-.05,.05);
    p.rip*=Math.exp(-dt*(3+model.settle*.08));
  }
 }
 function animate(now){
  const dt=Math.min(.038,Math.max(0,(now-prev)/1000));prev=now;
  if(!document.hidden){
    for(let n=0,step=Math.max(1,Math.ceil(dt/.012));n<step;n++)simulate(dt/step);
    model.t+=dt;draw();
  }
  requestAnimationFrame(animate);
 }
 function pick(x,y){
  let min=1e9,idx=-1;
  targets.forEach((p,i)=>{
   const d=((x-p.x)/p.rx)**2+((y-p.y)/p.ry)**2;
   if(d<min){min=d;idx=i;}
  });
  return min<=1.35?idx:-1;
 }
 function localPoint(e){const r=frame.getBoundingClientRect();return {x:((e.clientX-r.left)/r.width)*W,y:((e.clientY-r.top)/r.height)*H,sx:e.clientX-r.left,sy:e.clientY-r.top};}
 function pulse(x,y){
  ring.style.left=`${x}px`;ring.style.top=`${y}px`;
  ring.classList.remove('show');void ring.offsetHeight;ring.classList.add('show');
  clearTimeout(ringTimer);ringTimer=setTimeout(()=>ring.classList.remove('show'),170);
 }
 function kick(i,mult=1){
  if(i<0)return;
  const p=targets[i];const power=(.12+model.strength*.0036)*mult;
  p.vy+=power*(i%2?1:-1);
  p.vx+=(i%2?.6:-.6)*power;
  p.rip=Math.min(1.3,p.rip+(.25+model.strength*.007)*mult);
  // Neighboring lobe receives a smaller, delayed-looking counter-motion.
  const pair=i%2===0?i+1:i-1;
  targets[pair].vy-=power*.31;
  targets[pair].vx-=p.vx*.13;
  targets[pair].rip+=.11*mult;
 }
 function bounceAll(){targets.forEach((p,i)=>{
   p.vx=0;p.vy=0;
 });for(const i of [0,2,4])kick(i,1.14);for(const i of [1,3,5])kick(i,.76);}
 function clearAll(){for(const p of targets){p.dx=p.dy=p.vx=p.vy=p.rip=0;}}
 cvs.addEventListener('pointerdown',e=>{
   if(e.pointerType==='mouse'&&e.button!==0)return;
   e.preventDefault();const q=localPoint(e),i=pick(q.x,q.y);
   cvs.setPointerCapture?.(e.pointerId);
   pointer={id:e.pointerId,i,x:q.x,y:q.y,t:performance.now(),moved:0};
   if(i>=0){kick(i,.85);pulse(q.sx,q.sy);}
 },{passive:false});
 cvs.addEventListener('pointermove',e=>{
  if(!pointer||pointer.id!==e.pointerId||pointer.i<0)return;
  e.preventDefault();const q=localPoint(e),p=targets[pointer.i];
  const dx=q.x-pointer.x,dy=q.y-pointer.y;
  pointer.moved+=Math.hypot(dx,dy);
  p.dx=clamp(p.dx+dx/W*.68,-.041,.041);
  p.dy=clamp(p.dy+dy/H*.68,-.05,.05);
  const dt=Math.max(12,performance.now()-pointer.t)/1000;
  p.vx=clamp(p.vx+(dx/W)/dt*.045,-.3,.3);
  p.vy=clamp(p.vy+(dy/H)/dt*.045,-.3,.3);
  p.rip=Math.min(.8,p.rip+Math.hypot(dx,dy)*.0012);
  pointer.x=q.x;pointer.y=q.y;pointer.t=performance.now();
 },{passive:false});
 function release(e){if(!pointer||pointer.id!==e.pointerId)return;pointer=null;}
 cvs.addEventListener('pointerup',release);cvs.addEventListener('pointercancel',release);
 document.getElementById('bounce').addEventListener('click',bounceAll);
 document.getElementById('reset').addEventListener('click',clearAll);
 window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='INPUT'){e.preventDefault();bounceAll();}});
 window.addEventListener('resize',()=>needsResize=true);
 document.addEventListener('visibilitychange',()=>{prev=performance.now();});
 cvs.addEventListener('webglcontextlost',e=>{e.preventDefault();say('Graphics paused');});
 cvs.addEventListener('webglcontextrestored',()=>{try{createGL();needsResize=true;say('Touch to play');}catch(err){console.error(err);say('Graphics reset needed');}});
 const share=document.getElementById('share');
 share.addEventListener('click',async()=>{
  const url=location.origin+location.pathname;
  try{
   if(navigator.share){await navigator.share({title:'Peach Physics · Elf Lab',text:'A very serious physics experiment',url});return;}
   if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(url);say('Link copied!');return;}
   window.prompt('Copy this link:',url);
  }catch(err){if(err?.name!=='AbortError'){say('Use Safari Share to copy link');}}
 });
 setControls();
 img=new Image();img.onload=()=>{
  try{createGL();say('Ready · tap an elf');}
  catch(err){console.warn('WebGL fallback',err);fallback=true;ctx2d=cvs.getContext('2d');say(ctx2d?'Canvas fallback':'Browser graphics unavailable');}
  requestAnimationFrame(animate);
 };
 img.onerror=()=>say('Image could not load');img.src=data;
})();
</script>
<script>
if('serviceWorker' in navigator&&location.protocol==='https:'){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(err=>console.warn('Offline support unavailable',err)));
}
</script>
