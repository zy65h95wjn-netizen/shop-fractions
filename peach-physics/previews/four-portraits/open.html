<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11251e">
<title>Open Peaches preview</title>
<style>
html{color-scheme:dark;background:#0d1c17;color:#fff2df;font:1rem system-ui}
body{min-height:90svh;display:grid;place-items:center}
</style>
<p role="status">Opening the preview…</p>
<noscript>Enable JavaScript to open Peaches.</noscript>
<script>
const scope = new URL('./', location.href);
const destination = new URL(scope);
destination.search = location.search;

async function updatePreview() {
  if (!navigator.onLine) return;
  const registration = await navigator.serviceWorker?.getRegistration(scope.href);
  if (registration?.scope !== scope.href) return;
  await registration.update();
  const worker = registration.installing || registration.waiting;
  if (!worker) return;
  await new Promise(resolve => {
    function finish() {
      if (worker.state === 'activated' || worker.state === 'redundant') {
        worker.removeEventListener('statechange', finish);
        resolve();
      }
    }
    worker.addEventListener('statechange', finish);
    finish();
  });
}
// An offline launch uses the installed preview. Its caption reports the loaded engine.
updatePreview().catch(() => {}).finally(() => location.replace(destination.href));
</script>
</html>
