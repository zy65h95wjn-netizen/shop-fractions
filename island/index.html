<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moonlit Drop">
<meta name="theme-color" content="#0A0612">
<title>Moonlit Drop</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Haunted: a violet night lit by a full moon. Moonlight for text, lilac glow for what's hers, ember for what's urgent or loved. */
:root{
  color-scheme: dark;
  --bg:#0A0612; --text:#ECE6FF; --muted:#9B92B8; --soft:#CFC6EC;
  --accent:#B98CFF; --accent-2:#D9C2FF; --ink:#12081F;
  --ember:#FF7A2E; --ember-soft:#FFD9BF; --moon:#F4F0FF; --firefly:#FFD08A;
  --card:#140D22; --card2:#1C1330; --line:#2A2140; --line2:#3A2E58;
  --nav:rgba(14,9,26,.84); --acc-bg:#1A1030; --danger:#FF8A80;
  --glow:rgba(185,140,255,.35);
  --r-rare:#6FB3FF; --r-epic:#C08BFF; --r-legendary:#FFB15C; --r-mythic:#F4D35E; --r-none:#B98CFF; --r-tot:#FF9446;
  --head:'Cinzel Decorative', Georgia, 'Times New Roman', serif;
  --body:'Figtree', system-ui, -apple-system, sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
img{display:block}
.hidden{display:none !important}
h1,h2,h3{font-family:var(--head);margin:0;font-weight:700;letter-spacing:.02em}
h1{font-size:38px;line-height:1.05;color:var(--moon);text-shadow:0 0 18px rgba(185,140,255,.55)}
h2{font-size:17px;color:var(--accent);display:flex;align-items:center;gap:10px}
h2.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(185,140,255,.5),transparent)}
.muted{color:var(--muted)}
.small{font-size:13px}
a{color:var(--accent)}

/* ---- night sky ---- */
.night{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
  background:
    radial-gradient(60% 38% at 88% 4%, rgba(236,230,255,.14), transparent 60%),
    radial-gradient(90% 55% at 8% 100%, rgba(94,53,145,.32), transparent 70%),
    radial-gradient(70% 45% at 100% 70%, rgba(59,31,102,.40), transparent 70%)}
.night .fog{position:absolute;left:-50%;right:-50%;height:280px;bottom:-40px;
  background:radial-gradient(40% 50% at 30% 60%, rgba(185,140,255,.10), transparent 70%),radial-gradient(35% 45% at 70% 50%, rgba(236,230,255,.06), transparent 70%);
  animation:drift 40s linear infinite alternate}
@keyframes drift{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
.night .fly{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--firefly);box-shadow:0 0 10px 3px rgba(255,170,80,.5);opacity:0;animation:fly 9s ease-in-out infinite}
@keyframes fly{0%{opacity:0;transform:translate(0,0)}25%{opacity:.85}60%{opacity:.55;transform:translate(26px,-40px)}100%{opacity:0;transform:translate(-10px,-80px)}}

/* ---- layout ---- */
#views{position:relative;z-index:1;padding:calc(var(--sat) + 22px) 18px calc(var(--sab) + 112px);max-width:560px;margin:0 auto}
.view{display:flex;flex-direction:column;gap:22px;animation:fade .18s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.card{border-radius:18px;background:rgba(20,13,34,.78);border:1px solid var(--line);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

/* ---- tab bar ---- */
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(var(--sab) + 8px);max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;background:none;border:0;color:var(--muted);font-size:12px;font-weight:600;min-height:52px;border-radius:16px}
.tab[aria-current="page"]{color:var(--moon);text-shadow:0 0 10px rgba(185,140,255,.8)}
.tab[aria-current="page"] svg{filter:drop-shadow(0 0 6px rgba(185,140,255,.9))}
.tab svg{width:24px;height:24px}

/* ---- chips ---- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:36px;padding:0 15px;border-radius:18px;border:1px solid var(--line2);background:rgba(20,13,34,.7);color:var(--soft);font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--moon);background:rgba(185,140,255,.14);box-shadow:0 0 14px var(--glow)}
.chip .n{opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}

/* ---- today ---- */
.hello{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:flex;flex-direction:column;gap:2px;align-self:flex-start}
.hello .who{font-size:16px;color:var(--muted);transition:color .3s,text-shadow .7s;display:inline-flex;align-items:center;gap:6px;padding:6px 10px 6px 0;margin:-6px 0}
.hello .twinkle{display:inline-flex;color:var(--firefly);opacity:.7;animation:twinkle 6s ease-in-out infinite;transition:transform .7s ease-out;filter:drop-shadow(0 0 5px rgba(255,208,138,.7))}
.hello .twinkle svg{width:16px;height:16px}
@keyframes twinkle{0%,82%,100%{opacity:.55;transform:scale(.85) rotate(0)}88%{opacity:1;transform:scale(1.35) rotate(25deg)}94%{opacity:.75;transform:scale(1) rotate(45deg)}}
.hello .who{position:relative;font-size:20px;font-weight:600}
.hello .who::before{content:"";position:absolute;left:-14px;right:-18px;top:-8px;bottom:-8px;border-radius:999px;background:radial-gradient(closest-side, rgba(185,140,255,.16), transparent);pointer-events:none;animation:halo 5s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.6}50%{opacity:1}}
.hello .nm{background:linear-gradient(100deg,#E4DCFA 0%,#E4DCFA 38%,#FFF3D6 47%,#FFFFFF 50%,#EBDDFF 54%,#E4DCFA 62%,#E4DCFA 100%);background-size:260% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 3.8s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(185,140,255,.5))}
@keyframes shine{0%,25%{background-position:100% 0}75%,100%{background-position:0 0}}
.hello .gl{position:absolute;display:block;color:var(--firefly);pointer-events:none;opacity:0;filter:drop-shadow(0 0 4px rgba(255,208,138,.9));animation:glit 3.6s ease-in-out infinite}
.hello .gl svg{width:100%;height:100%;display:block}
.hello .g1{width:11px;height:11px;left:-7px;top:-3px;animation-delay:.2s}
.hello .g2{width:9px;height:9px;left:38%;top:-9px;color:var(--moon);animation-delay:1.3s}
.hello .g3{width:12px;height:12px;left:62%;bottom:-6px;animation-delay:2.1s}
.hello .g4{width:8px;height:8px;left:88%;top:-4px;color:#E6D3FF;animation-delay:2.9s}
@keyframes glit{0%,100%{opacity:0;transform:scale(.3) rotate(0)}10%,20%{opacity:1;transform:scale(1.15) rotate(30deg)}34%{opacity:0;transform:scale(.4) rotate(70deg)}}
.hello.pressing .nm{animation:none;background:none;color:var(--moon);-webkit-text-fill-color:var(--moon);filter:drop-shadow(0 0 10px rgba(185,140,255,.95))}
.hello.pressing .twinkle{animation:none;opacity:1;transform:scale(2.2) rotate(90deg);filter:drop-shadow(0 0 10px var(--firefly))}
/* the countdown headline: "19 nights / till Halloween" */
.hello h1 .n{color:#FFB37A;text-shadow:0 0 14px rgba(255,122,46,.75),0 0 32px rgba(255,122,46,.35)}
.hello .sub{font-family:var(--head);font-size:14px;letter-spacing:.14em;color:var(--accent-2);opacity:.88;margin-top:3px;text-shadow:0 0 10px rgba(185,140,255,.55)}

/* night sky over the top of Today: stars, moonglow, a rare shooting star */
#v-today{position:relative;isolation:isolate}
.sky{position:absolute;z-index:-1;left:-18px;right:-18px;top:calc(-22px - var(--sat));height:calc(var(--sat) + 250px);pointer-events:none;overflow:hidden;
  background:radial-gradient(46% 70% at 84% 0%, rgba(236,230,255,.13), transparent 70%),radial-gradient(75% 90% at 24% 0%, rgba(110,62,190,.30), transparent 72%),radial-gradient(120% 100% at 50% 0%, rgba(40,20,78,.5), transparent 75%);
  -webkit-mask-image:linear-gradient(180deg,#000 62%,transparent);mask-image:linear-gradient(180deg,#000 62%,transparent)}
.sky .st{position:absolute;border-radius:50%;animation:tw 6s ease-in-out infinite}
.sky .bs{position:absolute;color:var(--moon);filter:drop-shadow(0 0 5px rgba(236,230,255,.9));animation:tw 7s ease-in-out infinite}
.sky .bs svg{width:100%;height:100%;display:block}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.18}}
.sky .shoot{position:absolute;left:0;top:0;width:110px;height:2px;border-radius:2px;opacity:0;transform-origin:100% 50%;
  background:linear-gradient(90deg,rgba(236,230,255,0),rgba(236,230,255,.5) 70%,#fff);filter:drop-shadow(0 0 4px rgba(236,230,255,.85))}
.sky .shoot.go{animation:shoot 1.15s cubic-bezier(.3,.1,.6,1) forwards}
@keyframes shoot{0%{opacity:0;transform:rotate(var(--a)) translateX(-30px) scaleX(.3)}15%{opacity:1}70%{opacity:.85}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scaleX(1)}}

/* the go-to skin, framed in a moonlit window */
.hero{position:relative;height:330px;width:100%;padding:0;border-radius:200px 200px 16px 16px;overflow:hidden;border:1.5px solid rgba(185,140,255,.55);
  background:linear-gradient(180deg, rgba(10,6,18,.18), rgba(10,6,18,.34)), url(img/cottage-bg.jpg) center top/cover no-repeat, #140D22;
  box-shadow:0 0 0 6px rgba(185,140,255,.06), 0 0 44px rgba(185,140,255,.22), inset 0 0 50px rgba(0,0,0,.6);
  display:flex;align-items:flex-end;justify-content:center;color:var(--text)}
.hero .sky{position:absolute;inset:0;z-index:0}
.hero .moon{position:absolute;z-index:0;right:24%;top:12%;width:62px;height:62px;border-radius:50%;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='b' cx='42%' cy='40%' r='62%'><stop offset='0' stop-color='%23FBF9FF'/><stop offset='.62' stop-color='%23E2DCF3'/><stop offset='1' stop-color='%23B9AEDA'/></radialGradient><radialGradient id='l' cx='46%' cy='44%' r='56%'><stop offset='.72' stop-color='%234A3478' stop-opacity='0'/><stop offset='1' stop-color='%234A3478' stop-opacity='.42'/></radialGradient><filter id='s' x='-20%' y='-20%' width='140%' height='140%'><feGaussianBlur stdDeviation='3.6'/></filter><filter id='t'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' seed='7'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .3 0 0 0 0 .5 0 0 0 .9 -.32'/></filter><clipPath id='c'><circle cx='50' cy='50' r='50'/></clipPath></defs><g clip-path='url(%23c)'><circle cx='50' cy='50' r='50' fill='url(%23b)'/><g filter='url(%23s)' fill='%237D719F' fill-opacity='.52'><ellipse cx='25' cy='50' rx='14' ry='22' transform='rotate(12 25 50)'/><ellipse cx='38' cy='32' rx='15' ry='12'/><ellipse cx='50' cy='38' rx='10' ry='7'/><circle cx='58' cy='32' r='8.5'/><ellipse cx='64' cy='47' rx='11' ry='10'/><ellipse cx='81' cy='36' rx='5' ry='4.2'/><ellipse cx='75' cy='59' rx='5' ry='7.5'/><ellipse cx='41' cy='66' rx='8' ry='5'/><circle cx='28' cy='67' r='4'/><ellipse cx='48' cy='16' rx='17' ry='3'/><circle cx='66' cy='66' r='3.5'/></g><rect width='100' height='100' filter='url(%23t)' opacity='.5'/><g stroke='%23FFFFFF' stroke-opacity='.12' stroke-width='.5' stroke-linecap='round'><path d='M44 82 L30 96 M44 82 L58 97 M44 82 L44 99 M44 82 L22 78 M44 82 L68 76 M44 82 L52 60'/></g><circle cx='44' cy='82' r='1.4' fill='%23FFFFFF' fill-opacity='.85'/><circle cx='33' cy='45' r='1.1' fill='%23FFFFFF' fill-opacity='.55'/><circle cx='24' cy='34' r='1' fill='%23FFFFFF' fill-opacity='.6'/><circle cx='50' cy='50' r='50' fill='url(%23l)'/></g></svg>") center/100% 100% no-repeat;box-shadow:0 0 46px 12px rgba(236,230,255,.22)}
.hero .moon::after{content:"";position:absolute;inset:0;border-radius:inherit;background:#160E29;opacity:0;animation:heroMoonShade var(--cloud-time,27s) linear var(--cloud-phase,0s) infinite}
.hero .moon::before{content:"";position:absolute;inset:0;border-radius:inherit;background:#F4F0FF;box-shadow:0 0 75px 20px rgba(217,194,255,.4);opacity:0}
.hero .cloud{position:absolute;left:calc(50% - 180px);top:67px;width:300px;height:90px;opacity:0;
  background:radial-gradient(closest-side at 36% 56%,rgba(207,198,236,.30),transparent),radial-gradient(closest-side at 64% 44%,rgba(170,140,215,.26),transparent);
  animation:heroCloud var(--cloud-time,27s) linear var(--cloud-phase,0s) infinite}
.hero .bat{position:absolute;left:calc(50% - 64px);top:88px;width:34px;height:18px;fill:#0A0612;filter:drop-shadow(0 0 1.5px rgba(217,194,255,.95)) drop-shadow(0 0 6px rgba(185,140,255,.55));opacity:0;--scatter-x:-130px;--scatter-y:-48px;--scatter-r:-14deg}
.hero .bat + .bat{left:calc(50% + 54px);top:71px;width:15px;height:8px;--scatter-x:140px;--scatter-y:-34px;--scatter-r:18deg}
.hero.bats-passing .bat{animation:heroBatPass 4.6s linear both}
.hero.bats-passing .bat + .bat{animation-duration:4.2s;animation-delay:.4s}
.hero img{position:relative;z-index:1;height:100%;width:auto;max-width:100%;object-fit:contain;object-position:bottom}
.hero .mist{position:absolute;z-index:2;left:0;right:0;bottom:0;height:150px;background:linear-gradient(transparent,rgba(185,140,255,.14) 60%,rgba(10,6,18,.6))}
.hero .mist::before,.hero .mist::after{content:"";position:absolute;left:-40%;width:180%;bottom:-14px;height:150px;opacity:1;
  background:radial-gradient(ellipse at 28% 70%,rgba(207,198,236,.42),transparent 58%),radial-gradient(ellipse at 72% 60%,rgba(185,140,255,.32),transparent 56%);
  animation:heroFog 23s ease-in-out -9s infinite alternate}
.hero .mist::after{bottom:-24px;height:120px;opacity:.8;animation-duration:31s;animation-delay:-21s;animation-direction:alternate-reverse}
.hero .embers{position:absolute;inset:0;z-index:2}
.hero .ember{position:absolute;bottom:9px;left:18%;width:4px;height:4px;border-radius:50%;background:#FFB15C;box-shadow:0 0 8px 2px rgba(255,122,46,.75);opacity:0;--ember-x:13px;animation:heroEmber 14s ease-in-out -3s infinite}
.hero .ember:nth-child(2){left:37%;width:3px;height:3px;--ember-x:-17px;animation-duration:19s;animation-delay:-12s}
.hero .ember:nth-child(3){left:68%;--ember-x:20px;animation-duration:17s;animation-delay:-8s}
.hero .ember:nth-child(4){left:84%;width:3px;height:3px;--ember-x:-11px;animation-duration:12s;animation-delay:-6s}
.hero .ember:nth-child(5){left:27%;--ember-x:-9px;animation-duration:16s;animation-delay:-1s}
.hero .ember:nth-child(6){left:52%;width:3px;height:3px;--ember-x:15px;animation-duration:13s;animation-delay:-10s}
.hero .ember:nth-child(7){left:61%;width:3px;height:3px;--ember-x:-14px;animation-duration:18s;animation-delay:-15s}
.hero .ember:nth-child(8){left:76%;--ember-x:8px;animation-duration:15s;animation-delay:-4s}
.hero .candle{position:absolute;z-index:2;left:8%;right:8%;bottom:-10px;height:80px;background:radial-gradient(ellipse at 50% 100%,rgba(255,122,46,.7),transparent 70%);opacity:.5;animation:heroCandle 4.7s ease-in-out infinite}
.hero .lightning{position:absolute;inset:0;z-index:3;opacity:0;background:radial-gradient(ellipse at 50% 28%,rgba(244,240,255,.8),rgba(217,194,255,.25) 55%,transparent 85%)}
.hero .sky,.hero .mist,.hero .embers,.hero .candle,.hero .lightning,.hero img{pointer-events:none}
.hero.storm .lightning{animation:heroLightning .8s ease-out both}
.hero.storm .moon::before{animation:heroLightning .8s ease-out both}
.hero.storm .bat{animation:heroBatScatter .8s ease-out both}
.hero.scene-paused *,.hero.scene-paused *::before,.hero.scene-paused *::after{animation-play-state:paused!important}
@keyframes heroFog{from{transform:translateX(-9%)}to{transform:translateX(9%)}}
@keyframes heroCloud{0%,62%{opacity:0;transform:translateX(-110px)}68%{opacity:.7}76%{opacity:.85}86%,100%{opacity:0;transform:translateX(235px)}}
@keyframes heroMoonShade{0%,65%,87%,100%{opacity:0}72%{opacity:.12}77%{opacity:.18}82%{opacity:.08}}
@keyframes heroBatPass{0%{opacity:0;transform:translate(-120px,70px) rotate(-10deg)}12%,78%{opacity:1}100%{opacity:0;transform:translate(245px,-60px) rotate(8deg)}}
@keyframes heroEmber{0%,12%{opacity:0;transform:translate(0,0)}28%{opacity:.95}70%{opacity:.6}100%{opacity:0;transform:translate(var(--ember-x),-150px)}}
@keyframes heroCandle{0%,100%{opacity:.42}27%{opacity:.56}46%{opacity:.45}71%{opacity:.62}86%{opacity:.48}}
@keyframes heroLightning{0%{opacity:0}12%{opacity:.6}35%{opacity:.12}49%{opacity:.28}100%{opacity:0}}
@keyframes heroBatScatter{0%{opacity:0;transform:translate(0,0)}12%,40%{opacity:.85}100%{opacity:0;transform:translate(var(--scatter-x),var(--scatter-y)) rotate(var(--scatter-r))}}
.hero.empty{border-radius:200px 200px 16px 16px;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:36px;gap:8px;font-size:15px;color:var(--soft)}
.hero.empty .moon{opacity:.85}
.hero.empty .hero-prompt{position:relative;z-index:4;pointer-events:none}
.hero-cap{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:-8px;padding:0 4px}
.hero-cap > div{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;min-width:0}
.hero-cap b{font-family:var(--head);font-size:19px;letter-spacing:.02em;overflow-wrap:anywhere}
.hero-cap span{font-size:13px;color:var(--muted)}
.hero-change{flex-shrink:0;min-height:44px;padding:6px 10px;border:1px solid var(--line2);border-radius:10px;background:transparent;color:var(--soft);font-size:13px}

/* power hour */
.ph{border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(160deg, rgba(255,122,46,.16), rgba(20,13,34,.75));border:1px solid rgba(255,122,46,.45);box-shadow:0 0 30px rgba(255,122,46,.16)}
.ph.quiet{background:rgba(20,13,34,.75);border-color:var(--line2);box-shadow:none}
.ph .lbl{font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--ember)}
.ph.quiet .lbl{color:var(--muted)}
.ph .clock{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.05;color:var(--ember-soft);text-shadow:0 0 16px rgba(255,122,46,.55);font-variant-numeric:tabular-nums}
.ph .live{display:inline-flex;align-items:center;gap:7px}
.ph .dot{width:9px;height:9px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 0 rgba(255,122,46,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(255,122,46,0)}100%{box-shadow:0 0 0 0 rgba(255,122,46,0)}}

/* this week's sprite drop: the set, glowing in its own color */
.drop{position:relative;border-radius:20px;padding:18px 0 16px;overflow:hidden;isolation:isolate;--c:#B98CFF;
  background:radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--c) 24%, transparent), transparent 60%),radial-gradient(90% 80% at 100% 100%, rgba(94,53,145,.38), transparent 70%),rgba(20,13,34,.84);
  border:1px solid color-mix(in srgb, var(--c) 48%, transparent);box-shadow:0 0 34px color-mix(in srgb, var(--c) 20%, transparent), inset 0 1px 0 rgba(255,255,255,.05)}
.drop::before{content:"";position:absolute;z-index:-1;inset:-40% -60%;pointer-events:none;
  background:linear-gradient(105deg, transparent 42%, color-mix(in srgb, var(--c) 18%, transparent) 50%, transparent 58%);animation:dropSweep 10s ease-in-out infinite}
@keyframes dropSweep{0%,50%{transform:translateX(-42%)}100%{transform:translateX(42%)}}
.drop .hd{padding:0 18px;display:flex;flex-direction:column;gap:4px}
.drop .lbl{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ember)}
.drop .lbl .dot{width:8px;height:8px;border-radius:50%;background:var(--ember);animation:pulse 1.6s infinite}
.drop .lbl svg{width:15px;height:11px}
.drop h3{font-size:25px;line-height:1.1;color:var(--moon);text-shadow:0 0 18px color-mix(in srgb, var(--c) 75%, transparent)}
.drop .meta{font-size:13px;color:var(--muted)}
.drop .bonus{margin:10px 18px 0;padding:8px 12px;border-radius:12px;font-size:13.5px;line-height:1.35;color:var(--soft);background:color-mix(in srgb, var(--c) 10%, transparent);border:1px solid color-mix(in srgb, var(--c) 28%, transparent)}
.drop .bonus b{color:var(--c);font-weight:700}
.drop-row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:18px 18px 4px;scroll-padding:0 18px;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.drop-row::-webkit-scrollbar{display:none}
.drop-row .sp{flex:0 0 70px;scroll-snap-align:start;gap:6px}
.drop-row .sp:last-child{margin-right:30px}
.drop-row .sp .nm{font-size:12px}
.drop-row .sp .pod{animation:bob 4.6s ease-in-out infinite;animation-delay:calc(var(--i) * -.41s)}
.drop-row .sp .tick{width:22px;height:22px}
.drop-row .sp .tick svg{width:13px;height:13px}
.drop-row .sp.next .pod::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--c);opacity:0;pointer-events:none;animation:seek 2.4s ease-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes seek{0%{transform:scale(.88);opacity:.85}100%{transform:scale(1.28);opacity:0}}
.drop .dprog{padding:6px 18px 0;display:flex;flex-direction:column;gap:8px}
.drop .dprog .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;color:var(--soft)}
.drop .dprog .row b{font-family:var(--head);font-size:19px;color:var(--moon)}
.drop .bar{height:6px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.drop .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg, color-mix(in srgb, var(--c) 45%, #12081F), var(--c) 70%, #FFF3DC);box-shadow:0 0 10px var(--c);transition:width .7s cubic-bezier(.3,1.2,.5,1)}
.drop .foot{margin:14px 18px 0;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);line-height:1.35}
.drop .foot b{color:var(--soft);font-weight:600}
.drop .see{flex-shrink:0;min-height:34px;padding:0 13px;border-radius:17px;border:1px solid color-mix(in srgb, var(--c) 55%, transparent);background:color-mix(in srgb, var(--c) 14%, transparent);color:var(--moon);font-size:13px;font-weight:600}
.drop.done{border-color:rgba(244,201,93,.65);box-shadow:0 0 40px rgba(244,201,93,.22), inset 0 1px 0 rgba(255,255,255,.05)}
.drop.done .lbl{color:var(--firefly)}
.drop.done .bar i{background:linear-gradient(90deg,#B98A2E,#F4C95D 70%,#FFF6DA);box-shadow:0 0 12px rgba(244,201,93,.8)}

/* news */
.news{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 6px;scroll-snap-type:x mandatory}
.news::-webkit-scrollbar{display:none}
.newscard{flex:0 0 80%;scroll-snap-align:start;border-radius:16px;background:rgba(20,13,34,.85);border:1px solid var(--line);overflow:hidden;padding:0;text-align:left}
.newscard img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--card2)}
.newscard div{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.newscard b{font-size:15.5px;line-height:1.25}
.newscard span{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* coming up: dates on little headstones */
.ev{display:flex;align-items:center;gap:14px;padding:2px 0}
.ev .date{width:52px;height:62px;flex-shrink:0;text-align:center;border-radius:26px 26px 4px 4px;background:linear-gradient(#2A2140,#1A1330);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:4px}
.ev .date b{display:block;font-family:var(--head);font-size:21px;line-height:1}
.ev .date span{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px}
.ev .what{display:flex;flex-direction:column;gap:2px;min-width:0}
.ev .what b{font-size:15.5px;font-weight:600}
.ev .what span{font-size:13.5px;color:var(--muted)}

/* ---- shop tiles ---- */
.tile{position:relative;border-radius:16px;background:rgba(20,13,34,.85);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;padding:0;text-align:left;width:100%;color:var(--text)}
.tile.wide{grid-column:span 2}
.tile .art{position:relative;height:156px;background:var(--card2);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.tile.wide .art{height:176px}
.tile .art img{height:100%;width:100%;object-fit:cover;object-position:top}
.tile .art::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent, rgba(10,6,18,.35))}
.tile .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.tile .name{font-size:14.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .sub{font-size:12px;color:var(--muted)}
.price{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:700;color:var(--moon);font-variant-numeric:tabular-nums}
.price img{width:15px;height:15px}
.price s{color:var(--muted);font-weight:400}
.heart{position:absolute;top:4px;right:4px;z-index:2;width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#F1ECFF;filter:drop-shadow(0 1px 4px rgba(0,0,0,.8))}
.heart svg{width:24px;height:24px}
.heart.on{color:var(--ember);filter:drop-shadow(0 0 8px rgba(255,122,46,.7))}
.heart.pop svg{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.35)}}
.flag{position:absolute;left:8px;top:8px;z-index:2;font-size:11px;font-weight:700;color:var(--ink);background:var(--accent-2);padding:3px 8px;border-radius:6px}
.section-h{font-family:var(--head);font-weight:700;font-size:15px;letter-spacing:.03em;color:var(--accent);margin:10px 0 -6px}
.empty{border-radius:16px;border:1px dashed var(--line2);background:rgba(20,13,34,.5);padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.btn{height:46px;padding:0 18px;border-radius:14px;border:0;background:linear-gradient(180deg,#CBA6FF,#9F6BF0);color:var(--ink);font-weight:700;font-size:15px;box-shadow:0 0 20px rgba(185,140,255,.3)}
.btn.ghost{background:rgba(20,13,34,.8);color:var(--text);border:1px solid var(--line2);box-shadow:none}
.btn.block{width:100%}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.buy-note{margin:8px 4px 14px;font-size:13.5px;line-height:1.4;color:var(--muted);text-align:center}
.buy-note b{color:var(--soft);font-weight:600}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line2);background:rgba(20,13,34,.8);display:inline-flex;align-items:center;justify-content:center;color:var(--soft);flex-shrink:0}
.iconbtn svg{width:20px;height:20px}
.skel{background:linear-gradient(90deg,#140D22 0%,#21173A 50%,#140D22 100%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:16px}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.stale{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}

/* ---- sprites ---- */
.jar-row{display:flex;align-items:center;gap:18px}
.jar-btn{flex:0 0 auto;padding:4px;margin:-4px;background:none;border:0;border-radius:18px;transition:transform .2s,filter .2s}
.jar-btn:active{transform:scale(.95)}
.jar-btn[aria-pressed="true"]{filter:drop-shadow(0 0 14px rgba(185,140,255,.75))}
.player{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:10px 10px 10px 16px;margin:-8px 0 -4px;background:linear-gradient(90deg,rgba(185,140,255,.14),rgba(185,140,255,.03));border:1px solid var(--line2);border-radius:16px;color:var(--text);text-align:left}
.player .pl-l{display:flex;flex-direction:column;gap:3px;min-width:0}
.player .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.player b{font-size:18px;font-weight:700;color:var(--moon);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left;color:var(--text);min-width:0}
.mini .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mini b{font-family:var(--head);font-size:21px;color:var(--moon);line-height:1.1;font-variant-numeric:tabular-nums}
.mini b small{font-size:13px;color:var(--muted)}
.mini .s{font-size:12.5px;color:var(--muted)}
.mini .bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.mini .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#5E3591,#D9C2FF);box-shadow:0 0 8px rgba(185,140,255,.6)}
.costume{display:flex;gap:14px;align-items:stretch;padding:0;border-radius:18px;background:var(--card);border:1px solid var(--line2);overflow:hidden;text-align:left;color:var(--text);width:100%;box-shadow:0 0 24px rgba(185,140,255,.12)}
.costume .art{flex:0 0 118px;height:146px;background:#1C1330}
.costume .art img{width:100%;height:100%;object-fit:cover;object-position:top}
.costume .tx{display:flex;flex-direction:column;justify-content:center;gap:5px;padding:12px 14px 12px 0;min-width:0}
.costume .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ember);font-weight:700}
.costume b{font-family:var(--head);font-size:18px;line-height:1.15;color:var(--moon)}
.costume .s{font-size:13px;color:var(--muted)}
.player .pl-r{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.player .wins{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:50px;height:50px;padding:0 8px;border-radius:12px;background:rgba(185,140,255,.14);border:1px solid var(--line2);color:var(--moon);font-family:var(--head);font-weight:700;font-size:19px;line-height:1}
.player .wins svg{width:16px;height:12px;color:var(--firefly);margin-bottom:3px;filter:drop-shadow(0 0 4px rgba(255,208,138,.6))}
.ev .what .cd{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--accent)}
.ev .what .cd.hot{color:var(--ember);text-shadow:0 0 10px rgba(255,122,46,.45)}
.player .lvl{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px;height:50px;padding:0 8px;border-radius:12px;background:linear-gradient(160deg,#FFB15C,#FF7A2E);color:#2A1206;font-family:var(--head);font-weight:700;font-size:21px;line-height:1;box-shadow:0 0 18px rgba(255,122,46,.45)}
.player .lvl small{font-family:var(--body);font-size:9.5px;letter-spacing:.16em;font-weight:800;opacity:.8;margin-bottom:3px}
.jar{flex:0 0 auto;width:92px;height:116px}
.jar-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.jar-txt .big{font-family:var(--head);font-weight:700;font-size:36px;line-height:1;color:var(--moon);text-shadow:0 0 14px rgba(185,140,255,.5);font-variant-numeric:tabular-nums}
.jar-txt .big small{font-size:18px;color:var(--muted);text-shadow:none}
.jar-txt .sub{font-size:14.5px;font-weight:600;color:var(--accent)}
.jar-txt .fine{font-size:13px;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 10px}
.sp{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:none;border:0;padding:0;color:var(--muted);--c:var(--accent);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.sp .pod{position:relative;width:100%;aspect-ratio:1/1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle, rgba(255,255,255,.035), transparent 70%);border:1px solid rgba(155,146,184,.18);transition:transform .25s, box-shadow .35s, border-color .35s, background .35s}
.sp .pod img,.sp .pod .wisp{grid-area:1/1;width:74%;height:74%;object-fit:contain;pointer-events:none;transition:filter .35s, opacity .35s}
.sp .pod .wisp{color:var(--c)}
.sp .pod img.ok + .wisp{display:none}
.sp:not(.got) .pod img,.sp:not(.got) .pod .wisp{filter:grayscale(1) brightness(.6);opacity:.5}
.sp.got{color:var(--moon)}
.sp.got .pod{border-color:color-mix(in srgb, var(--c) 70%, transparent);background:radial-gradient(circle, color-mix(in srgb, var(--c) 28%, transparent), transparent 70%);box-shadow:0 0 22px color-mix(in srgb, var(--c) 42%, transparent), inset 0 0 18px color-mix(in srgb, var(--c) 22%, transparent)}
.sp.got .pod img,.sp.got .pod .wisp{filter:drop-shadow(0 0 8px color-mix(in srgb, var(--c) 65%, transparent))}
.sp .nm{font-size:13.5px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.sp .tick{position:absolute;z-index:3;right:-1px;bottom:-1px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--ink);box-shadow:0 0 10px var(--c);opacity:0;transform:scale(.4);transition:opacity .2s, transform .3s cubic-bezier(.3,1.6,.5,1)}
.sp .tick svg{width:15px;height:15px}
.sp.got .tick{opacity:1;transform:scale(1)}
.sp .new{position:absolute;top:-6px;left:-2px;z-index:3;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--ember);color:var(--ink)}
.sp.pop .pod{animation:catch .8s cubic-bezier(.3,1.5,.5,1)}
@keyframes catch{0%{transform:scale(.65) rotate(-24deg);filter:brightness(2.4)}55%{transform:scale(1.2) rotate(8deg);filter:brightness(1.6)}100%{transform:scale(1) rotate(0);filter:none}}
.fx .ring{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2px solid currentColor;box-shadow:0 0 18px currentColor, inset 0 0 12px currentColor;animation:ring .95s cubic-bezier(.2,.7,.3,1) both}
@keyframes ring{0%{transform:scale(.3);opacity:.95}100%{transform:scale(2.8);opacity:0}}
.fx .bloom{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:radial-gradient(circle,#FFFFFF 0%,currentColor 28%,transparent 68%);opacity:0;animation:bloom .75s ease-out both}
@keyframes bloom{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.7);opacity:0}}
.fx .caught{position:absolute;white-space:nowrap;font-family:var(--head);font-weight:700;font-size:15px;letter-spacing:.03em;color:var(--moon);opacity:0;animation:caught 1.7s ease-out both}
@keyframes caught{0%{opacity:0;transform:translate(-50%,8px) scale(.85)}18%{opacity:1;transform:translate(-50%,-8px) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-58px)}}
.pt.drift{animation-duration:1.9s;animation-timing-function:ease-out}
.sp.holding .pod{transform:scale(.92);transition:transform .45s ease}
.sp.hint .pod{animation:hint 2.4s ease-in-out 3}
@keyframes hint{0%,100%{box-shadow:0 0 0 0 rgba(255,208,138,0)}50%{box-shadow:0 0 0 6px rgba(255,208,138,.35), 0 0 26px rgba(255,208,138,.55)}}
.fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.pt{position:absolute;border-radius:50%;margin:-4px 0 0 -4px;filter:drop-shadow(0 0 6px currentColor);animation:rise 1.15s cubic-bezier(.15,.7,.35,1) forwards}
.pt svg{width:100%;height:100%;display:block}
@keyframes rise{0%{transform:translate(0,0) scale(.7);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* sprite card */
.sp-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:6px}
.sp-card .orb{position:relative;width:200px;height:200px;border-radius:50%;display:grid;place-items:center;margin:4px 0 12px;--c:var(--accent);
  border:1px solid color-mix(in srgb, var(--c) 60%, transparent);background:radial-gradient(circle, color-mix(in srgb, var(--c) 30%, transparent), transparent 70%);box-shadow:0 0 40px color-mix(in srgb, var(--c) 35%, transparent)}
.sp-card .orb.dim{filter:saturate(.35);opacity:.8}
.sp-card .orb img,.sp-card .orb .wisp{grid-area:1/1;width:78%;height:78%;object-fit:contain;filter:drop-shadow(0 0 12px color-mix(in srgb, var(--c) 60%, transparent))}
.sp-card .orb .wisp{color:var(--c)}
.sp-card .orb img.ok + .wisp{display:none}
.sp-card h2{font-size:27px;color:var(--moon);justify-content:center;text-shadow:0 0 14px rgba(185,140,255,.5)}
.sp-card .meta{font-size:15px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.sp-card .pill{font-size:13.5px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.sp-card .how{margin:14px 0 4px;width:100%;text-align:left;border-radius:16px;background:rgba(20,13,34,.8);border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.sp-card .how span{font-size:14px;font-weight:700;color:var(--accent)}
.sp-card .how p{margin:0;font-size:17.5px;line-height:1.45;color:var(--soft)}
.sp-card .how p.lv{font-size:15.5px;color:var(--muted);margin-top:4px}
.sp-card .how + .how{margin-top:0}
.sp-card .how{margin-bottom:10px}

/* ---- me ---- */
.avatar{width:66px;height:66px;border-radius:33px;border:1.5px solid var(--accent);background:var(--card2);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 18px var(--glow)}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:top}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(20,13,34,.8);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{height:40px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:600;color:var(--soft)}
.seg button[aria-pressed="true"]{background:rgba(185,140,255,.16);color:var(--moon);box-shadow:inset 0 0 0 1px var(--accent), 0 0 14px var(--glow)}
.stat{border-radius:16px;background:rgba(20,13,34,.8);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:6px}
.stat span{font-size:13px;color:var(--muted)}
.stat b{font-family:var(--head);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.prog{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#8E5CE6,#D9C2FF);border-radius:5px;box-shadow:0 0 10px var(--glow);transition:width .35s ease}

/* ---- sheets ---- */
.scrim{position:fixed;inset:0;background:rgba(5,2,10,.66);z-index:40;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow-y:auto;background:linear-gradient(180deg,#150D26,#0E0819 40%);border-radius:24px 24px 0 0;border-top:1px solid rgba(185,140,255,.4);box-shadow:0 -10px 40px rgba(185,140,255,.12);z-index:41;padding:10px 20px calc(var(--sab) + 24px);transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.show{transform:none}
.sheet.full{top:0;max-height:none;border-radius:0;border-top:0;padding-top:calc(var(--sat) + 16px)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 14px}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:14px;font-weight:600;color:var(--soft)}
.field .help{font-size:12.5px;color:var(--muted)}
.input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line2);background:rgba(20,13,34,.9);padding:0 14px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(185,140,255,.18)}
textarea.input{height:120px;padding:12px 14px;resize:vertical;line-height:1.4}
.secret{-webkit-text-security:disc}
.list{display:flex;flex-direction:column;gap:8px}
.res{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;background:rgba(20,13,34,.85);border:1px solid var(--line);width:100%;text-align:left}
.res img{width:56px;height:56px;border-radius:10px;background:var(--card2);object-fit:cover}
.res .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.res .txt b{font-size:15px;font-weight:600}
.res .txt span{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translate(-50%,20px);background:var(--moon);color:var(--ink);font-weight:700;font-size:14px;padding:10px 16px;border-radius:14px;opacity:0;transition:all .25s;z-index:60;pointer-events:none;max-width:88vw;text-align:center;box-shadow:0 0 24px rgba(236,230,255,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.banner{border-radius:14px;background:rgba(255,122,46,.1);border:1px solid rgba(255,122,46,.45);color:var(--ember-soft);font-size:13.5px;padding:12px 14px;line-height:1.4}
.detail-art{height:300px;border-radius:18px;overflow:hidden;background:var(--card2);margin-bottom:16px;border:1px solid var(--line)}
.detail-art img{width:100%;height:100%;object-fit:cover;object-position:top}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span:first-child{color:var(--muted)}
.kvcard .kv:last-child{border-bottom:0}

/* ---- the hidden note ---- */
.reveal{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 24px) 22px calc(var(--sab) + 24px);background:radial-gradient(90% 60% at 50% 42%,rgba(94,53,145,.6) 0%,rgba(6,3,12,.97) 70%);opacity:0;transition:opacity .4s ease;overflow:hidden}
.reveal.show{opacity:1}
.reveal .letter{position:relative;width:100%;max-width:420px;border-radius:24px;padding:36px 26px 26px;background:linear-gradient(165deg,#2C1850 0%,#170D2B 50%,#0E0819 100%);border:1px solid rgba(185,140,255,.55);box-shadow:0 0 0 1px rgba(185,140,255,.12),0 0 70px rgba(185,140,255,.35),0 30px 80px rgba(0,0,0,.6);transform:scale(.7) translateY(30px);opacity:0;transition:transform .7s cubic-bezier(.2,1.4,.3,1) .25s,opacity .4s ease .25s}
.reveal.show .letter{transform:none;opacity:1}
.reveal .seal{position:absolute;top:-28px;left:50%;margin-left:-28px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 38%, #FFFFFF, #D6CCF4 60%, #A897DA);color:var(--ember);display:flex;align-items:center;justify-content:center;box-shadow:0 0 34px rgba(236,230,255,.7)}
.reveal .seal svg{width:26px;height:26px}
.reveal .kicker{font-family:var(--head);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--accent);text-align:center;margin-bottom:16px}
.reveal .line{margin:0 0 6px;font-size:19px;line-height:1.55;white-space:pre-wrap;opacity:0;transform:translateY(8px);transition:opacity .6s ease,transform .6s ease;min-height:1em}
.reveal .line.in{opacity:1;transform:none}
.reveal .tapclose{margin-top:22px;text-align:center;font-size:13px;color:var(--muted);opacity:0;transition:opacity .6s ease}
.reveal .tapclose.in{opacity:1}
.spark{position:absolute;left:50%;top:50%;width:10px;height:10px;color:var(--accent);pointer-events:none;opacity:0}
.spark svg{width:100%;height:100%}
.spark.go{animation:burst 1.4s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}70%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--s)) rotate(var(--r))}}

/* ---- swiping between tabs ---- */
#views{touch-action:pan-y}
.view.from-right{animation:fromRight .26s cubic-bezier(.2,.8,.2,1)}
.view.from-left{animation:fromLeft .26s cubic-bezier(.2,.8,.2,1)}
@keyframes fromRight{from{opacity:.3;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes fromLeft{from{opacity:.3;transform:translateX(-60px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .hero .cloud,.hero .bat,.hero .ember,.hero .lightning,.hero .moon::before,.hero .moon::after{opacity:0!important}
}
</style>
</head>
<body>

<div class="night" id="night" aria-hidden="true"><div class="fog"></div></div>
<div class="fx" id="fx" aria-hidden="true"></div>
<main id="views"></main>

<nav class="tabbar" aria-label="Main">
  <button class="tab" data-tab="today" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Today</button>
  <button class="tab" data-tab="shop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Shop</button>
  <button class="tab" data-tab="sprites">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20V11a6 6 0 0 1 12 0v9l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5z"/><circle cx="10" cy="11" r=".9" fill="currentColor"/><circle cx="14" cy="11" r=".9" fill="currentColor"/></svg>Sprites</button>
  <button class="tab" data-tab="me">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Me</button>
</nav>

<div id="scrim" class="scrim hidden"></div>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ================= constants ================= */
var API = 'https://fortnite-api.com';
var LS = 'isl.';
var ICON = {
  heart: '<svg viewBox="0 0 24 24" fill="FILL" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  person: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
  sparkle: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.2 6.3L20.5 11l-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z"/><path d="M19 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" opacity=".6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  wisp: '<svg class="wisp" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6c-12 0-20 9.5-20 21v25c0 2 2.2 3 3.7 1.6l4.3-4 4.6 4.3c1 .9 2.6.9 3.6 0L32 49.6l3.8 3.3c1 .9 2.6.9 3.6 0l4.6-4.3 4.3 4c1.5 1.4 3.7.4 3.7-1.6V27C52 15.5 44 6 32 6z" fill="currentColor"/><ellipse cx="25" cy="28" rx="3.6" ry="4.6" fill="#0A0612"/><ellipse cx="39" cy="28" rx="3.6" ry="4.6" fill="#0A0612"/><path d="M28 37c2.4 2 5.6 2 8 0" stroke="#0A0612" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c.9 4.6 2.6 6.9 8 8-5.4 1.1-7.1 3.4-8 8-.9-4.6-2.6-6.9-8-8 5.4-1.1 7.1-3.4 8-8z"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>'
};
var RARITY = {rare:'var(--r-rare)',epic:'var(--r-epic)',legendary:'var(--r-legendary)',mythic:'var(--r-mythic)'};
var RARITY_NAME = {rare:'Rare',epic:'Epic',legendary:'Legendary',mythic:'Mythic'};

/* ================= storage ================= */
function load(k, d){ try{ var v = localStorage.getItem(LS+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function drop(k){ try{ localStorage.removeItem(LS+k); }catch(e){} }

var S = {
  tab: 'today',
  settings: load('settings', null),          // {name, epic, key, note, skin:{id,name,img}}
  wishlist: load('wishlist', []),            // [{id,name,img,type}]
  got: load('sprites', {}),                  // {spriteId:true}
  shop: load('shop', null),                  // {at, date, vbuck, entries:[...]}
  news: load('news', null),                  // {at, items:[...]}
  stats: load('stats', {}),                  // {season:{at,data}, lifetime:{...}}
  statWin: 'season',
  shopFilter: 'all',
  spriteGroup: null,
  spritesData: null, eventsData: null,
  err: {}, loading: {}
};

/* ================= helpers ================= */
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function pad(n){ return (n<10?'0':'')+n; }
function fmtNum(n){ return n==null ? '—' : Number(n).toLocaleString(); }
function hms(ms){ if(ms<0) ms=0; var s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60); return pad(h)+':'+pad(m)+':'+pad(s%60); }
function dur(ms){ var m=Math.max(0,Math.round(ms/60000)), d=Math.floor(m/1440), h=Math.floor(m%1440/60), mm=m%60; if(d) return d+'d '+h+'h'; if(h) return h+'h '+pad(mm)+'m'; return mm+'m'; }
function ago(t){ var m=Math.round((Date.now()-t)/60000); if(m<1) return 'just now'; if(m<60) return m+' min ago'; var h=Math.round(m/60); if(h<24) return h+'h ago'; return Math.round(h/24)+'d ago'; }
function dayTime(d){ return d.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'})+' · '+d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
function localDate(str){ var p=str.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(function(){ t.classList.remove('show'); }, 2200); }
function hex(c){ return c && /^[0-9a-f]{6}/i.test(c) ? '#'+c.slice(0,6) : null; }
function imgTag(src, alt, cls){ return src ? '<img src="'+esc(src)+'" alt="'+esc(alt||'')+'" loading="lazy" decoding="async"'+(cls?' class="'+cls+'"':'')+' onerror="this.style.visibility=\'hidden\'">' : ''; }

function getJSON(url, opts){
  opts = opts || {};
  var ctl = ('AbortController' in window) ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ctl) ctl.abort(); }, opts.timeout || 15000);
  return fetch(url, {headers: opts.headers || {}, cache: opts.cache || 'default', signal: ctl ? ctl.signal : undefined})
    .then(function(r){
      clearTimeout(timer);
      return r.json().catch(function(){ return {}; }).then(function(body){
        if(!r.ok){ var e = new Error(body && body.error || ('HTTP '+r.status)); e.status = r.status; throw e; }
        return body;
      });
    }, function(e){ clearTimeout(timer); var x = new Error('offline'); x.status = 0; throw x; });
}

/* ================= data: local json ================= */
function loadLocalData(){
  var bust = '?v=' + Math.floor(Date.now()/3600000);
  return Promise.all([
    getJSON('data/sprites.json'+bust, {cache:'no-store'}).catch(function(){ return load('spritesData', null); }),
    getJSON('data/events.json'+bust, {cache:'no-store'}).catch(function(){ return load('eventsData', null); })
  ]).then(function(r){
    S.spritesData = r[0]; S.eventsData = r[1];
    if(r[0]) save('spritesData', r[0]);
    if(r[1]) save('eventsData', r[1]);
  });
}

/* ================= data: shop ================= */
function normShop(d){
  var out = [];
  (d.entries || []).forEach(function(e){
    var items = e.brItems || [];
    if(!items.length) return;
    var main = items.filter(function(i){ return i.type && i.type.value==='outfit'; })[0] || items[0];
    var rimg = e.newDisplayAsset && e.newDisplayAsset.renderImages && e.newDisplayAsset.renderImages[0] && e.newDisplayAsset.renderImages[0].image;
    var im = main.images || {};
    out.push({
      key: e.offerId || main.id,
      section: (e.layout && e.layout.name) || 'Item Shop',
      rank: (e.layout && e.layout.rank) || 0,
      sort: e.sortPriority || 0,
      name: (e.bundle && e.bundle.name) || main.name,
      kind: e.bundle ? 'Bundle' : ((main.type && main.type.displayValue) || ''),
      typeVal: e.bundle ? 'bundle' : ((main.type && main.type.value) || ''),
      types: items.map(function(i){ return i.type && i.type.value; }),
      img: rimg || (e.bundle && e.bundle.image) || im.featured || im.icon || im.smallIcon,
      price: e.finalPrice, regular: e.regularPrice,
      banner: e.banner && e.banner.value,
      out: e.outDate,
      wide: e.tileSize === 'Size_2_x_1',
      c1: hex(e.colors && e.colors.color1), c3: hex(e.colors && e.colors.color3),
      main: {id: main.id, name: main.name, img: im.icon || im.smallIcon || im.featured, type: (main.type && main.type.displayValue) || ''},
      items: items.map(function(i){ var m=i.images||{}; return {id:i.id, name:i.name, type:(i.type&&i.type.displayValue)||'', img:m.icon||m.smallIcon, set:i.set&&i.set.value, rarity:i.rarity&&i.rarity.displayValue}; }),
      desc: main.description || '',
      set: main.set && main.set.value
    });
  });
  return {at: Date.now(), date: d.date, vbuck: d.vbuckIcon, entries: out};
}
function shopFresh(){
  if(!S.shop) return false;
  var today = new Date().toISOString().slice(0,10);
  return S.shop.date && S.shop.date.slice(0,10) === today && (Date.now()-S.shop.at) < 30*60000;
}
function fetchShop(force){
  if(!force && shopFresh()) return Promise.resolve();
  S.loading.shop = true; delete S.err.shop;
  return getJSON(API+'/v2/shop?language=en').then(function(b){
    S.shop = normShop(b.data || {}); save('shop', S.shop);
  }).catch(function(e){ S.err.shop = e; })
    .then(function(){ S.loading.shop = false; rerender(['today','shop']); });
}

/* ================= data: news ================= */
function fetchNews(force){
  if(!force && S.news && Date.now()-S.news.at < 60*60000) return Promise.resolve();
  S.loading.news = true; delete S.err.news;
  return getJSON(API+'/v2/news/br?language=en').then(function(b){
    var m = (b.data && b.data.motds) || [];
    var items = m.filter(function(x){ return !x.hidden; })
      .sort(function(a,c){ return (c.sortingPriority||0)-(a.sortingPriority||0); })
      .map(function(x){ return {id:x.id, title:x.title, body:x.body, img:x.tileImage||x.image}; });
    S.news = {at: Date.now(), items: items}; save('news', S.news);
  }).catch(function(e){ S.err.news = e; })
    .then(function(){ S.loading.news = false; rerender(['today']); });
}

/* ================= data: stats ================= */
function fetchStats(win, force){
  var st = S.settings || {};
  if(!st.key || !st.epic) return Promise.resolve();
  var c = S.stats[win];
  if(!force && c && c.v===2 && c.user === st.epic && Date.now()-c.at < 15*60000) return Promise.resolve();
  S.loading['stats'+win] = true; delete S.err['stats'+win];
  rerender(['me']);
  var url = API+'/v2/stats/br/v2?name='+encodeURIComponent(st.epic)+'&accountType=epic&timeWindow='+win+'&image=none';
  return getJSON(url, {headers:{'Authorization': st.key}}).then(function(b){
    var d = b.data || {}, o = (d.stats && d.stats.all && d.stats.all.overall) || null;
    var all = (d.stats && d.stats.all) || {}, modes = {}, inputs = {};
    ['solo','duo','trio','squad','ltm'].forEach(function(m){ if(all[m]) modes[m] = all[m]; });
    ['keyboardMouse','gamepad','touch'].forEach(function(k){ var x = d.stats && d.stats[k] && d.stats[k].overall; if(x && x.matches) inputs[k] = x.matches; });
    S.stats[win] = {v:2, at: Date.now(), user: st.epic, name: d.account && d.account.name,
      bp: d.battlePass && d.battlePass.level, bpProg: d.battlePass && d.battlePass.progress,
      o: o, modes: modes, inputs: inputs};
    save('stats', S.stats);
  }).catch(function(e){ S.err['stats'+win] = e; })
    .then(function(){ S.loading['stats'+win] = false; rerender(['me','today']); });
}
function statsError(e){
  if(!e) return '';
  if(e.status===403) return 'Her stats are set to private in Fortnite, so they can\'t be read right now.';
  if(e.status===404) return 'Couldn\'t find that Epic username. Double-check it in settings.';
  if(e.status===401) return 'The stats key isn\'t working. Re-enter it in Setup.';
  if(e.status===0) return 'Couldn\'t reach the stats service. Check the connection and try again.';
  return 'Stats are having a moment ('+esc(e.message)+'). Try again in a bit.';
}

/* ================= data: cosmetics search ================= */
function searchCosmetics(q, type){
  var url = API+'/v2/cosmetics/br/search/all?language=en&matchMethod=contains&name='+encodeURIComponent(q)+(type?'&type='+type:'');
  return getJSON(url).then(function(b){ return (b.data||[]).slice(0,40); })
    .catch(function(e){ if(e.status===404) return []; throw e; });
}

/* ================= wishlist ================= */
function inWish(id){ return S.wishlist.some(function(w){ return w.id===id; }); }
function toggleWish(item){
  if(inWish(item.id)){
    S.wishlist = S.wishlist.filter(function(w){ return w.id!==item.id; });
    toast('Removed from wishlist');
  } else {
    S.wishlist.push({id:item.id, name:item.name, img:item.img, type:item.type||''});
    toast(isInShop(item.id) ? 'Added — and it\'s in the shop now!' : 'Added. You\'ll see it here when it hits the shop.');
  }
  save('wishlist', S.wishlist);
}
function isInShop(id){ return !!(S.shop && S.shop.entries.some(function(e){ return e.items.some(function(i){ return i.id===id; }); })); }
function wishHits(){
  if(!S.shop) return [];
  var ids = {}; S.wishlist.forEach(function(w){ ids[w.id]=1; });
  return S.shop.entries.filter(function(e){ return e.items.some(function(i){ return ids[i.id]; }); });
}
function entryWished(e){ return e.items.some(function(i){ return inWish(i.id); }); }

/* ================= events ================= */
function powerHourState(){
  var ev = S.eventsData, now = Date.now();
  var list = ((ev && ev.powerHours) || []).map(function(p){ return {name:p.name, note:p.note, s:Date.parse(p.start), e:Date.parse(p.end)}; })
    .filter(function(p){ return !isNaN(p.s) && !isNaN(p.e); }).sort(function(a,b){ return a.s-b.s; });
  var live = list.filter(function(p){ return p.s<=now && now<p.e; })[0];
  if(live) return {mode:'live', p:live};
  var next = list.filter(function(p){ return p.s>now; })[0];
  if(next) return {mode:'next', p:next};
  var last = list.filter(function(p){ return p.e<=now; }).pop();
  return {mode:'none', last:last};
}

function dropSet(){
  var d = S.spritesData, dated = ((d && d.sprites) || []).filter(function(s){ return s.added; });
  if(!dated.length) return null;
  var last = dated.reduce(function(m, s){ return s.added > m ? s.added : m; }, ''), tally = {};
  dated.forEach(function(s){ if(s.added === last) tally[s.group] = (tally[s.group]||0) + 1; });
  var grp = Object.keys(tally).sort(function(a, b){ return tally[b]-tally[a]; })[0];
  var D = localDate(last), from = D.getTime() - 6*86400000;
  var g = (d.groups||[]).filter(function(x){ return x.id === grp; })[0] || {};

function bindSpriteGrid(grid){

  grid.addEventListener('touchmove', function(e){ var p = e.touches[0]; if(Math.abs(p.clientX-sx)>10 || Math.abs(p.clientY-sy)>10) clear(); }, {passive:true});

    '<span class="candle" aria-hidden="true"></span><span class="lightning" aria-hidden="true"></span>';

function bindHeroScene(el){
  var batsTimer = null, batsFirst = true, active = false, pointer = null, sx = 0, sy = 0, moved = false;
  var empty = el.classList.contains('empty');
  el.style.setProperty('--cloud-time', (23+Math.random()*6).toFixed(2)+'s');
  el.style.setProperty('--cloud-phase', (-Math.random()*23).toFixed(2)+'s');
  function scheduleBats(){
    clearTimeout(batsTimer);
    if(!active || !el.isConnected) return;
    batsTimer = setTimeout(function(){
      batsTimer = null;
      if(active && el.isConnected) el.classList.add('bats-passing');
    }, batsFirst ? 5000+Math.random()*4000 : 18000+Math.random()*17000);
    batsFirst = false;
  }
  function sync(){
    var next = !document.hidden && !heroMotion.matches;
    el.classList.toggle('scene-paused', !next);
    if(!empty){
      el.setAttribute('aria-label', (heroMotion.matches ? 'Moonlit skin window: ' : 'Awaken lightning around ')+S.settings.skin.name);
      el.setAttribute('aria-disabled', String(heroMotion.matches));
    }
    if(next===active) return;
    active = next;
    if(active) scheduleBats();
    else {
      clearTimeout(batsTimer); batsTimer=null; pointer=null; moved=true;
      el.classList.remove('storm','bats-passing');
    }
  }
  // Pointer events observe only this button; the existing touch swipe keeps ownership of the gesture.
  el.addEventListener('pointerdown', function(e){
    if(!e.isPrimary || e.button!==0){ moved=true; return; }
    pointer=e.pointerId; sx=e.clientX; sy=e.clientY; moved=false;
  });
  function movement(e){
    if(e.pointerId===pointer && (Math.abs(e.clientX-sx)>10 || Math.abs(e.clientY-sy)>10)) moved=true;
  }
  el.addEventListener('pointermove', movement, {passive:true});
  el.addEventListener('pointerup', function(e){ movement(e); if(e.pointerId===pointer) pointer=null; });
  el.addEventListener('pointercancel', function(){ moved=true; pointer=null; });
  el.addEventListener('pointerleave', function(){ if(pointer!==null) moved=true; });
  el.onclick = function(e){
    if((e.detail && moved) || !el.isConnected || document.hidden) return;
    if(empty){ openSearch('skin'); return; }
    if(!active || heroMotion.matches || performance.now()<heroStormUntil) return;
    heroStormUntil=performance.now()+2400;
    clearTimeout(batsTimer); batsTimer=null;
    el.classList.remove('bats-passing');
    el.classList.add('storm');
  };
  el.addEventListener('animationend', function(e){
    if(e.target===$('.lightning', el) && e.animationName==='heroLightning'){
      el.classList.remove('storm'); scheduleBats();
    } else if(e.target===$('.bat', el) && e.animationName==='heroBatPass'){
      el.classList.remove('bats-passing'); scheduleBats();
    }
  });
  heroScene = {sync:sync, destroy:function(){ active=false; clearTimeout(batsTimer); }};
  sync();
}
heroMotion.addEventListener('change', function(){ if(heroScene) heroScene.sync(); });

function bindLongPress(el){
  var t = null, sx = 0, sy = 0;
  function cancel(){ clearTimeout(t); t=null; el.classList.remove('pressing'); }
  el.addEventListener('touchstart', function(e){ start(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  el.addEventListener('mousedown', function(e){ start(e.clientX, e.clientY); });
  function start(x,y){
    if(!(S.settings && S.settings.note)) return;
    sx=x; sy=y; el.classList.add('pressing');
    t = setTimeout(function(){ cancel(); if(navigator.vibrate) navigator.vibrate(30); openNote(); }, 700);
  }
  el.addEventListener('touchmove', function(e){ var p=e.touches[0]; if(Math.abs(p.clientX-sx)>10||Math.abs(p.clientY-sy)>10) cancel(); }, {passive:true});
  ['touchend','touchcancel','mouseup','mouseleave'].forEach(function(n){ el.addEventListener(n, cancel); });
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}

/* ================= swipe between tabs ================= */
(function(){
  var area = $('#views'), sx=0, sy=0, st=0, track=false, decided=false, horiz=false, v=null;
  area.addEventListener('touchstart', function(e){
    if(e.touches.length!==1 || !$('#sheet').classList.contains('hidden') || $('.reveal')) { track=false; return; }
    // let carousels and chip rows scroll sideways on their own
    if(e.target.closest('.chips, .news, .drop-row, input, textarea')) { track=false; return; }
    var p=e.touches[0]; sx=p.clientX; sy=p.clientY; st=Date.now(); track=true; decided=false; horiz=false; v=$('#views .view');
  }, {passive:true});
  area.addEventListener('touchmove', function(e){
    if(!track) return;
    var p=e.touches[0], dx=p.clientX-sx, dy=p.clientY-sy;
    if(!decided && (Math.abs(dx)>10 || Math.abs(dy)>10)){ decided=true; horiz = Math.abs(dx) > Math.abs(dy)*1.3; }
    if(!horiz) return;
    var i=TABS.indexOf(S.tab), edge=(dx>0 && i===0)||(dx<0 && i===TABS.length-1);
    if(v){ v.style.transition='none'; v.style.transform='translateX('+(dx*(edge?0.15:0.45))+'px)'; v.style.opacity = String(1-Math.min(Math.abs(dx)/900, .35)); }
  }, {passive:true});
  function end(e){
    if(!track) return; track=false;
    if(!horiz){ return; }
    var p=e.changedTouches[0], dx=p.clientX-sx, fast = Math.abs(dx)/(Date.now()-st) > .45;
    var i=TABS.indexOf(S.tab), next = null;
    if((dx < -70 || (fast && dx < -50)) && i < TABS.length-1) next = TABS[i+1];
    if((dx > 70 || (fast && dx > 50)) && i > 0) next = TABS[i-1];
    if(next){ go(next); }
    else if(v){ v.style.transition='transform .2s ease, opacity .2s ease'; v.style.transform=''; v.style.opacity=''; }
  }
  area.addEventListener('touchend', end);
  area.addEventListener('touchcancel', function(){ track=false; if(v){ v.style.transform=''; v.style.opacity=''; } });
})();

/* ================= boot ================= */
(function fireflies(){
  var n = $('#night');
  for(var i=0;i<9;i++){ var f=document.createElement('i'); f.className='fly'; f.style.left=(6+Math.random()*88)+'%'; f.style.top=(28+Math.random()*66)+'%'; f.style.animationDelay=(Math.random()*9).toFixed(1)+'s'; f.style.animationDuration=(7+Math.random()*6).toFixed(1)+'s'; n.appendChild(f); }
})();
/* a shooting star over Today: first one soon after opening, then every 45-90s */
(function shootingStars(){
  var rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)');
  function later(ms){ setTimeout(fire, ms); }
  function fire(){
    var el = $('#v-today .shoot');
    if(el && document.visibilityState === 'visible' && S.tab === 'today' && !(rm && rm.matches)){
      var sky = el.parentNode, w = sky.clientWidth, hh = sky.clientHeight, toLeft = Math.random() < .5, ang = 14 + Math.random()*14;
      el.classList.remove('go'); void el.offsetWidth;
      el.style.setProperty('--a', (toLeft ? 180-ang : ang)+'deg');
      el.style.setProperty('--d', Math.round(170 + Math.random()*90)+'px');
      el.style.left = Math.round(w*(toLeft ? .45 + Math.random()*.35 : .05 + Math.random()*.35) - 110)+'px';
      el.style.top = Math.round(hh*(.08 + Math.random()*.25))+'px';
      el.classList.add('go');
    }
    later(45000 + Math.random()*45000);
  }
  later(6000 + Math.random()*6000);
})();
$$('.tab').forEach(function(t){ t.onclick = function(){ go(t.dataset.tab); }; });
render();
loadLocalData().then(function(){ rerender(['today','sprites']); });
fetchShop(); fetchNews(); fetchStats(S.statWin);
if(!S.settings || !S.settings.name) openSetup(true);

})();
