<style>

*{box-sizing:border-box}html{background:var(--bg);-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(110% 450px at 50% -200px,#263448 0%,transparent 95%),var(--bg);font:16px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}button:disabled{opacity:.45;cursor:default}img{display:block}h1,h2,h3,p{margin:0}h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif}h1{font-size:30px;letter-spacing:-.03em}h2{font-size:22px;letter-spacing:-.02em}h3{font-size:18px}small,.muted{color:var(--muted)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--gold);font-weight:700}.page{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 18px calc(var(--safe) + 103px)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center}.sigil{width:46px;height:46px;border:1px solid #6e5b43;border-radius:14px;background:linear-gradient(150deg,#363146,#141d2b);display:grid;place-items:center;font:28px Georgia;color:var(--gold)}.sub{font-size:13px;color:var(--muted)}.section{margin:22px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.panel{background:linear-gradient(160deg,rgba(29,39,55,.95),rgba(17,24,37,.95));border:1px solid var(--line);border-radius:var(--r);padding:16px}.hero{position:relative;overflow:hidden;background:radial-gradient(90% 120% at 100% 0%,rgba(198,165,101,.14),transparent 65%),linear-gradient(140deg,#20293b,#111927);border:1px solid #64543f;border-radius:22px;padding:20px}.hero::after{content:'✦';position:absolute;right:18px;top:6px;font-size:72px;color:rgba(226,193,138,.07);pointer-events:none}.hero h2{font-size:26px;line-height:1.15;margin-top:8px}.hero p{m l.listening{color:var(--green);border-color:#426b5e;background:rgba(96,195,151,.1)}.pill.done{color:#b1bad1;border-color:#505a70;background:#283245}.series{padding:15px}.series-head{width:100%;background:none;border:0;padding:0;text-align:left;color:inherit;display:flex;gap:12px;align-items:center}.series-head .detail .sub{margin-bottom:0}.chev{color:var(--gold);font-size:22px}.series-books{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:grid;gap:11px}.book{padding:12px;border:1px solid var(--line);border-radius:14px;background:#121b2a}.book .row{align-items:flex-start}.book .order{font-size:12px;color:var(--gold);font-weight:700}.book .meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.action{min-height:37px;background:#263247;border:1px solid #435068;color:var(--text);border-radius:10px;padding:7px 10px;font-size:12px;font-weight:700}.action[aria-pressed=true]{background:#54452e;border-color:#e2c18a;color:#ffe5b2}.action.danger{color:#ffb7b7}.search{width:100%;height:52px;border:1px solid #5c5570;background:#1c2538;border-radius:14px;padding:0 16px;color:var(--text);font-size:16px}.hint{font-size:13px;color:var(--muted);line-height:1.55}.empty{border:1px dashed #526074;border-radius:16px;padding:26px 18px;text-align:center;color:var(--muted);background:rgba(21,29,43,.4)}.empty strong{display:block;color:var(--text);margin-bottom:6px}.search-result{padding:12px;display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px}.search-result .detail{padding-right:3px}.statusmsg{font-size:13px;margin-top:10px;color:var(--muted)}.statusmsg.error{color:var(--red)}.tabs{position:fixed;bottom:calc(8px + var(--safe));left:10px;right:10px;z-index:20;margin:auto;max-width:580px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px;background:rgba(18,26,40,.97);border:1px solid #435067;box-shadow:0 12px 30px #0007;border-radius:20px;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}.tab{border:0;background:none;color:var(--muted);border-radius:13px;min-height:54px;font-size:11px;font-weight:700;display:grid;gap:1px;place-items:center}.tab span{font-size:22px;font-weight:400}.tab[aria-current=page]{color:var(--gold);background:#2b3040}.toast{position:fixed;bottom:calc(var(--safe) + 95px);left:50%;transform:translate(-50%,12px);z-index:50;opacity:0;pointer-events:none;transition:.2s;background:#f3e4c8;color:#1d2030;padding:11px 17px;border-radius:12px;min-width:max-content;max-width:92vw;text-align:center;font-weight:700;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}.modalbg{position:fixed;inset:0;z-index:25;background:#02060cbb;display:flex;align-items:flex-end;justify-content:center}.modal{background:#161f2e;color:var(--text);border:1px solid #647187;border-bottom:0;border-radius:22px 22px 0 0;padding:18px 18px calc(var(--safe) + 24px);width:100%;max-width:620px;max-height:90dvh;overflow:auto}.modal .grab{height:5px;width:40px;border-radius:10px;background:#647187;margin:0 auto 16px}.modal .actions{margin-top:20px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:13px;font-weight:700;color:var(--gold)}.field input,.field textarea,.field select{width:100%;min-height:46px;background:#202c3e;border:1px solid #56647b;border-radius:11px;color:var(--text);padding:10px 12px;font-size:16px}.field textarea{min-height:100px;resize:vertical}.divider{height:1px;background:var(--line);margin:18px 0}.hidden{display:none!important}.queue-controls{display:flex;flex-direction:column;gap:5px}.queue-controls button{width:36px;min-height:30px;border-radius:8px;border:1px solid #536179;background:#263247;color:var(--text)}.notice{border-left:3px solid var(--gold2);padding:10px 13px;background:#1b2636;border-radius:0 10px 10px 0;font-size:13px;color:var(--muted)}@media(min-width:590px){.page{padding-left:25px;padding-right:25px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.book-open{display:block;width:100%;border:0;background:transparent;color:inherit;padding:0;text-align:left;cursor:pointer;border-radius:9px}.book-open .row{width:100%}.book-open:active{opacity:.8}.book-open .detail b{text-decoration-color:var(--gold)}
.wish-link{display:flex;align-items:center;gap:11px;min-width:0;color:var(--text);text-decoration:none;border-radius:10px}.wish-link .detail{min-width:0}.wish-link:focus-visible{outline:2px solid var(--gold)}.wish-arrow{color:var(--gold);font-size:13px;white-space:nowrap;font-weight:700}.book-summary{margin-top:15px;background:#101827;border-radius:12px;padding:12px 14px}.book-summary summary{color:var(--gold);font-size:14px;font-weight:700;cursor:pointer}.book-summary p{margin-top:10px;line-height:1.58;white-space:pre-line;color:var(--muted);font-size:14px}.detail-meta{display:grid;gap:5px;margin:13px 0}.detail-meta p{color:var(--muted);font-size:14px}.modal .status-actions .action{flex:1;min-height:43px}
.stat{display:block;width:100%;cursor:pointer;color:var(--text);font:inherit;-webkit-tap-highlight-color:transparent}
.stat:active{background:#263347;transform:translateY(1px)}
.stat:focus-visible,.library-filter:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.library-filters{display:flex;gap:8px;overflow-x:auto;margin:6px 0 18px;padding:2px 0 5px}
.library-filter{flex:none;min-height:44px;padding:9px 13px;background:#202b3d;color:var(--text);border:1px solid #49566c;border-radius:12px;font-size:13px;font-weight:700}
.library-filter[aria-pressed="true"]{border-color:var(--gold);background:#51452e;color:#ffebc4}

#app{touch-action:pan-y}
#app.swipe-next{animation:swipeNext .22s ease-out}

<body>
<main class="page" id="app"></main>
<nav class="tabs" aria-label="Main navigation">
  <button class="tab" data-tab="home" aria-current="page"><span aria-hidden="true">⌂</span>Home</button>
  <button class="tab" data-tab="library"><span aria-hidden="true">▤</span>Series</button>
  <button class="tab" data-tab="discover"><span aria-hidden="true">⌕</span>Discover</button>
  <button class="tab" data-tab="settings"><span aria-hidden="true">⚙</span>Settings</button>
</nav>
<div id="overlay"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='lorekeeper.v1', API='https://libexdb.com';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s??'').trim();
const slug=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const safeUrl=v=>{try{const u=new URL(v);return u.protocol==='https:'?u.href:'';}catch{return '';}};
const joinNames=a=>Array.isArray(a)?a.map(x=>clean(typeof x==='string'?x:x&&x.name)).filter(Boolean).join(', '):clean(a);
const minutes=m=>Number.isFinite(Number(m))&&Number(m)>0?`${Math.floor(m/60)}h ${Math.round(m%60)}m`:'';
const position=b=>{const p=clean(b.position);const n=parseFloat(p);return Number.isFinite(n)?n:99999;};
const cover=(src,cls='')=>safeUrl(src)?`<img class="cover ${cls}" src="${esc(safeUrl(src))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'cover blank ${cls}',textContent:'✦'}))">`:`<span class="cover blank ${cls}" aria-hidden="true">✦</span>`;
const short=(s,n=110)=>clean(s).slice(0,n);
const stateDefault=()=>({version:1,series:[],queue:[],wishlist:[]});
function validate(data){if(!data||data.version!==1||!Array.isArray(data.series)||!Array.isArray(data.queue)||data.series.length>100||data.queue.length>3000)throw Error('Backup is not a compatible Lorekeeper backup.');for(const s of data.series){if(!s||typeof s.id!=='string'||!Array.isArray(s.books)||s.books.length>200||typeof s.name!=='string')throw Error('Invalid series in backup.');for(const b of s.books){if(!b||typeof b.id!=='string'||typeof b.title!=='string'||!['unread','listening','finished'].includes(b.status))throw Error('Invalid book in backup.');}}if(!Array.isArray(data.wishlist))data.wishlist=[];data.wishlist=data.wishlist.filter(w=>w&&typeof w.id==='string'&&typeof w.title==='string').slice(0,500);return data;}
let store;try{store=validate(JSON.parse(localStorage.getItem(KEY)))}catch{store=stateDefault();}
let tab='home', libraryFilter='all', expanded=new Set(), searchResults=[], seriesResults=[], selectedBook=null, searchType='books', query='', searchBusy=false, searchError='', awaiting=null;
function commit(next){try{localStorage.setItem(KEY,JSON.stringify(next));store=next;return true;}catch{toast('Could not save. Check available phone storage.');return false;}}
function update(fn){const next=typeof structuredClone==='function'?structuredClone(store):JSON.parse(JSON.stringify(store));fn(next);if(commit(next)){render();return true;}return false;}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2700);}
function bookFrom(raw,seriesAsin,seriesName){const ref=(raw.series||[]).find(x=>x.asin===seriesAsin)||{};return {id:clean(raw.asin)||slug(),title:short(raw.title||'Untitled',300),author:joinNames(raw.authors),narrator:joinNames(raw.narrators),length:Number(raw.lengthMinutes)||0,cover:safeUrl(raw.imageUrl),position:clean(ref.position)||'',status:'unread',finishedAt:null,addedAt:new Date().toISOString(),series:seriesName,summary:short(raw.summary||raw.description||'',2500),link:safeUrl(raw.link)};}
function allBooks(){return store.series.flatMap(s=>s.books.map(b=>({...b,seriesId:s.id,seriesName:s.name})));}
function nextBook(s){return [...s.books].sort((a,b)=>position(a)-position(b)).find(b=>b.status==='listening')||[...s.books].sort((a,b)=>position(a)-position(b)).find(b=>b.status!=='finished');}
function counts(){const bs=allBooks();return {series:store.series.length,done:bs.filter(b=>b.status==='finished').length,now:bs.filter(b=>b.status==='listening').length};}
function item(id){for(const s of store.series){const b=s.books.find(x=>x.id===id);if(b)return {s,b};}return null;}
function queueClean(){return store.queue.filter((id,i)=>store.queue.indexOf(id)===i&&item(id)?.b.status!=='finished'&&item(id));}
function audibleLink(b){const link=safeUrl(b.link);if(link){try{const host=new URL(link).hostname.toLowerCase();if(host==='audible.com'||host.endsWith('.audible.com'))return link;}catch{}}return 'https://www.audible.com/search?keywords='+encodeURIComponent([b.title,b.author].filter(Boolean).join(' '));}
function wishItem(raw){return {id:clean(raw.asin||raw.id),title:short(raw.title||'Untitled',300),author:joinNames(raw.authors)||clean(raw.author),narrator:joinNames(raw.narrators)||clean(raw.narrator),cover:safeUrl(raw.imageUrl||raw.cover),length:Number(raw.lengthMinutes||raw.length)||0,link:audibleLink({...raw,author:joinNames(raw.authors)||clean(raw.author)}),addedAt:new Date().toISOString()};}
function toggleWish(raw){const wish=wishItem(raw);if(!wish.id){toast('This book has no catalog ID.');return;}const had=store.wishlist.some(w=>w.id===wish.id);if(update(s=>{if(had)s.wishlist=s.wishlist.filter(w=>w.id!==wish.id);else s.wishlist.unshift(wish);})){toast(had?'Removed from wishlist.':'Saved to wishlist.');showBook(raw);}}
function sectionTitle(t,other=''){return `<div class="section"><h2>${esc(t)}</h2>${other}</div>`;}
function bookMini(b,subtitle=''){return `${cover(b.cover)}<div class="detail"><b>${esc(b.title)}</b><p class="sub">${esc(subtitle||b.author||'Unknown author')}</p>${b.narrator?`<div class="sub">Narrated by ${esc(b.narrator)}</div>`:''}</div>`;}
function bookCard(b,sid,index,editing=false){return `<article class="book" data-bookid="${esc(b.id)}"><button class="book-open" data-ownedbook="${esc(b.id)}" aria-label="Details for ${esc(b.title)}"><div class="row">${cover(b.cover,'tiny')}<div class="detail"><span class="order">${b.position?'BOOK '+esc(b.position):'BOOK '+(index+1)}</span><b>${esc(b.title)}</b><div class="meta">${esc(b.author||'Unknown author')}${b.narrator?` · ${esc(b.narrator)}`:''}${minutes(b.length)?` · ${minutes(b.length)}`:''}</div></div></div></button><div class="actions"><button class="action" data-status="unread" data-id="${esc(b.id)}" aria-pressed="${b.status==='unread'}">Not started</button><button class="action" data-status="listening" data-id="${esc(b.id)}" aria-pressed="${b.status==='listening'}">Listening</button><button class="action" data-status="finished" data-id="${esc(b.id)}" aria-pressed="${b.status==='finished'}">Finished</button><button class="action" data-queue="${esc(b.id)}">${store.queue.includes(b.id)?'✓ Queued':'+ Queue'}</button></div>${editing?`<div class="actions"><button class="action" data-order="up" data-id="${esc(b.id)}" ${index===0?'disabled':''}>↑ Move</button><button class="action" data-order="down" data-id="${esc(b.id)}">↓ Move</button><button class="action danger" data-removebook="${esc(b.id)}">Remove book</button></div>`:''}</article>`;}
function home(){const c=counts(),listening=allBooks().filter(b=>b.status==='listening');const next=store.series.map(s=>({s,b:nextBook(s)})).filter(x=>x.b).sort((a,b)=>a.s.name.localeCompare(b.s.name));const queued=queueClean().map(id=>item(id)).filter(Boolean);return `<div class="top"><div class="brand"><div class="sigil">L</div><div><div class="eyebrow">Your listening journal</div><h1>The Lorekeeper</h1></div></div></div><div class="hero"><div class="eyebrow">A library of worlds</div><h2>${listening.length?esc(listening[0].title):'Your next great adventure awaits.'}</h2><p>${listening.length?`Currently listening · ${esc(listening[0].seriesName)}`:'Search for a series, add its books, and keep your place through every adventure.'}</p><button class="btn ${listening.length?'secondary':''}" data-goto="${listening.length?'library':'discover'}">${listening.length?'View your series':'Find your first series'} →</button></div><div class="stats"><button class="stat" data-statfilter="all" aria-label="Show all ${c.series} series"><strong>${c.series}</strong><span>Series →</span></button><button class="stat" data-statfilter="finished" aria-label="Show ${c.done} finished books"><strong>${c.done}</strong><span>Finished →</span></button><button class="stat" data-statfilter="listening" aria-label="Show ${c.now} listening books"><strong>${c.now}</strong><span>Listening →</span></button></div>${sectionTitle('What’s next',`<button class="btn ghost small" data-goto="library">All series →</button>`)}${next.length?`<div class="stack">${next.map(({s,b})=>`<div class="panel"><button class="book-open" data-ownedbook="${esc(b.id)}" aria-label="Details for ${esc(b.title)}"><div class="row">${bookMini(b,s.name)}</div></button><div class="actions"><span class="pill ${b.status==='listening'?'listening':''}">${b.status==='listening'?'Currently listening':'Next in series'}</span><button class="action" data-setnext="${esc(b.id)}">${b.status==='listening'?'Mark finished':'Start listening'}</button></ function discover(){return `<div class="top"><div><div class="eyebrow">Search the audiobook catalog</div><h1>Discover</h1></div></div><div class="panel"><div class="between"><button class="action" data-searchtype="books" aria-pressed="${searchType==='books'}">Audiobooks</button><button class="action" data-searchtype="series" aria-pressed="${searchType==='series'}">Series names</button></div><form id="searchForm" style="margin-top:12px;display:flex;gap:8px"><input id="query" class="search" type="search" enterkeyhint="search" spellcheck="false" autocorrect="off" placeholder="${searchType==='books'?'Book title or author':'Series name'}" value="${esc(query)}" aria-label="Search audiobooks" required minlength="2"><button class="btn" type="submit">Find</button></form><p class="hint" style="margin-top:11px">${searchType==='books'?'Search an audiobook, then choose its series to add every book in order.':'Search directly for a series to import all its books.'}</p></div>${searchBusy?`<div class="statusmsg" role="status">Searching the audiobook catalog…</div>`:''}${searchError?`<div class="notice" style="margin-top:14px;color:var(--red)" role="alert">${esc(searchError)}<div style="margin-top:10px"><button class="btn small ghost" data-manualseries="1">Add a series manually</button></div></div>`:''}${!searchBusy&&!searchError?(searchType==='books'&&searchResults.length?sectionTitle(`${searchResults.length} audiobook results`)+`<div class="stack">${searchResults.map((b,i)=>`<button class="search-result" data-result="${i}">${cover(b.imageUrl)}<div class="detail"><b>${esc(b.title||'Untitled')}</b><p class="sub">${esc(joinNames(b.authors)||'Author unknown')}</p><p class="sub">${esc(joinNames(b.narrators)||'Narrator not listed')}${minutes(b.lengthMinutes)?` · ${minutes(b.lengthMinutes)}`:''}</p>${b.series?.length?`<span class="pill">${esc(b.series[0].name||'Series available')}${b.series[0].position?' · Book '+esc(b.series[0].position):''}</span>`:''}</div><span class="chev">›</span>< function go(dest,filter){if(!['home','library','discover','settings'].includes(dest))return;if(dest==='library')libraryFilter=filter||'all';tab=dest;window.scrollTo(0,0);render();}
/* Swipe across the page to switch tabs without intercepting vertical scrolling,
   text entry, horizontal scrollers, or an open book/details sheet. */
(()=>{
 const pages=['home','library','discover','settings'], page=$('#app');
 let gesture=null;
 page.addEventListener('touchstart',e=>{
   gesture=null;
   if(e.touches.length!==1||$('#overlay').firstElementChild||e.target.closest('input,textarea,select,[contenteditable],[role="slider"]'))return;
   const t=e.touches[0];
   // Leave iOS Safari's browser-edge navigation gestures alone.
   if(t.clientX<24||t.clientX>innerWidth-24)return;
   for(let n=e.target;n&&n!==page;n=n.parentElement){
     const css=getComputedStyle(n);
     if(n.scrollWidth>n.clientWidth+3 && /^(auto|scroll)$/.test(css.overflowX))return;
   }
   gesture={x:t.clientX,y:t.clientY,horizontal:null};
 },{passive:true});
 page.addEventListener('touchmove',e=>{
   if(!gesture)return;
   if(e.touches.length!==1){gesture=null;return;}
   const t=e.touches[0],dx=t.clientX-gesture.x,dy=t.clientY-gesture.y;
   if(gesture.horizontal===null&&(Math.abs(dx)>12||Math.abs(dy)>12))
     gesture.horizontal=Math.abs(dx)>Math.abs(dy)*1.35;
   if(gesture.horizontal&&e.cancelable)e.preventDefault();
 },{passive:false});
 page.addEventListener('touchend',e=>{
   if(!gesture)return;
   const g=gesture;gesture=null;
   if(!g.horizontal||e.changedTouches.length!==1||$('#overlay').firstElementChild)return;
   const t=e.changedTouches[0],dx=t.clientX-g.x,dy=t.clientY-g.y;
   if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.35)return;
   const index=pages.indexOf(tab),next=index+(dx<0?1:-1);
   if(next<0||next>=pages.length)return;
   go(pages[next]);
   page.classList.remove('swipe-next','swipe-prev');
   void page.offsetWidth;
   page.classList.add(dx<0?'swipe-next':'swipe-prev');
 });
 page.addEventListener('touchcancel',()=>{gesture=null;},{passive:true});
 page.addEventListener('animationend',e=>{if(e.target===page)page.classList.remove('swipe-next','swipe-prev');});
})();

const detailCache=new Map();
function showOwnedBook(id){const found=item(id);if(!found)return;const {s,b}=found,d=detailCache.get(id)||b;const label={unread:'Not started',listening:'Listening',finished:'Finished'};

const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8000);fetch(`${API}/book/${encodeURIComponent(id)}?region=us`,{signal:controller.signal}).then(r=>{if(!r.ok)throw Error('Not found');return r.json();}).then(raw=>{const summary=short(raw.summary||raw.description||'',2500);if(summary)detailCache.set(id,{summary});const target=$('#overlay [data-owned-modal]');if(!target||target.dataset.ownedModal!==id)return;const el=$('#ownedSynopsis');if(el)el.innerHTML=summary?`<details class="book-summary"><summary>Synopsis · may contain spoilers</summary><p>${esc(summary)}</p></details>`:'<p class="hint" style="margin-top:15px">No synopsis available.</p>';}).catch(()=>{const target=$('#overlay [data-owned-modal]');if(target?.dataset.ownedModal===id){const el=$('#ownedSynopsis');if(el)el.innerHTML='<p class="hint" style="margin-top:15px">Synopsis unavailable offline. Book details are saved on this phone.</p>';}}).finally(()=>clearTimeout(timeout));}}
function normalizeResponse(data){return Array.isArray(data)?data:(Array.isArray(data?.data)?data.data:[]);}
async function request(path){const controller=new AbortController(), timeout=setTimeout(()=>controller.abort(),12500);try{const res=await fetch(API+path,{signal:controller.signal,headers:{Accept:'application/json'}});if(!res.ok)throw Error(res.status===404?'No results found.':`Catalog unavailable (HTTP ${res.status}).`);const data=await res.json();if(!Array.isArray(data))throw Error('Unexpected catalog response.');return data;}catch(e){if(e.name==='AbortError')throw Error('Search timed out. Try again.');if(e instanceof TypeError)throw Error('Cannot reach audiobook catalog. Check connection and try again.');throw e;}finally{clearTimeout(timeout);}}

async function importSeries(id,name){if(awaiting)return;awaiting=id;openModal(`${modalHead('Importing series')}<p class="hint" style="margin-top:18px">Finding all the books in ${esc(name)}…</p>`);try{const raw=await request(`/series/books/${encodeURIComponent(id)}?region=us`);const books=raw.filter(x=>x&&x.asin&&x.title).map(x=>bookFrom(x,id,name));if(!books.length)throw Error('No books were returned for this series.');books.sort((a,b)=>position(a)-position(b)||a.title.localeCompare(b.title));const unique=[],seen=new Set();for(const b of books){const key=b.position?`position:${b.position}`:`id:${b.id}`;if(!seen.has(key)){unique.push(b);seen.add(key);}}
const existing=store.series.find(x=>x.id===id);const candidate={id,name:clean(name),author:unique[0]?.author||'',books:unique,createdAt:new Date().toISOString()};if(existing){const old=new Map(existing.books.map(b=>[b.id,b]));candidate.books=unique.map(b=>old.has(b.id)?{...b,status:old.get(b.id).status,finishedAt:old.get(b.id).finishedAt}:b);for(const b of existing.books)if(!candidate.books.some(x=>x.id===b.id))candidate.books.push(b);}
if(update(s=>{const i=s.series.findIndex(x=>x.id===id);if(i>=0)s.series[i]={...candidate,createdAt:s.series[i].createdAt};else s.series.unshift(candidate);s.wishlist=s.wishlist.filter(w=>!candidate.books.some(b=>b.id===w.id));})){expanded.add(id);closeModal();go('library');toast(existing?'Series updated; progress preserved.':`${unique.length} books added.`);}else closeModal();}catch(e){openModal(`${modalHead('Could not import')}<p class="notice" style="margin-top:18px;color:var(--red)">${esc(e.message||'Catalog unavailable.')}</p><div class="actions"><button class="btn ghost block" data-manualseries="1" data-name="${esc(name)}">Create series manually</button></div>`);}finally{awaiting=null;}}

function manualBook(id,defaults={}){
 const ss=store.series, named=clean(defaults.series||'');
 const match=ss.find(s=>named&&s.name.toLowerCase()===named.toLowerCase());

 const opts=ss.map(s=>`<option value="${esc(s.id)}" ${s.id===target?'selected':''}>${esc(s.name)}</option>`).join('');
 const newOne=target==='__new__';
 openModal(`${modalHead('Add a book')}<form id="bookForm"><div class="field"><label for="seriesId">Series</label><select id="seriesId">${opts}<option value="__new__" ${newOne?'selected':''}>＋ Create a new series</option></select></div><div class="field ${newOne?'':'hidden'}" id="newSeriesWrap"><label for="newSeriesName">New series name</label><input id="newSeriesName" maxlength="180" value="${esc(named)}" placeholder="e.g. The Licanius Trilogy" ${newOne?'required':''}></div><div class="field"><label for="bookTitle">Title</label><input id="bookTitle" maxlength="250" required value="${esc(defaults.title||'')}"></div><div class="field"><label for="bookAuthor">Author (optional)</label><input id="bookAuthor" maxlength="200" value="${esc(defaults.author||'')}"></div><div class="field"><label for="bookNarrator">Narrator (optional)</label><input id="bookNarrator" maxlength="200" value="${esc(defaults.narrator||'')}"></div><div class="field"><label for="bookOrder">Series position</label><input id="bookOrder" maxlength="12" value="${esc(defaults.position||'')}"></div><button class="btn block" type="submit">Add audiobook</button></form>`);
 // Remember book metadata from Discover without writing any data until Save.
 manualBook.pending={cover:safeUrl(defaults.cover),length:Number(defaults.length)||0,summary:short(defaults.summary||'',2500),link:safeUrl(defaults.link)};
}
function backup(){const code='LK1.'+btoa(unescape(encodeURIComponent(JSON.stringify(store))));const ok=()=>toast('Backup copied. Save it in Notes.');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(code).then(ok,()=>backupFallback(code));else backupFallback(code);}
function backupFallback(code){openModal(`${modalHead('Copy your backup')}<p class="hint" style="margin:13px 0">Select all and copy this code to Notes.</p><textarea id="backupText" class="search" style="height:140px;resize:vertical" readonly>${esc(code)}</textarea>`);$('#backupText').select();}
function restoreModal(){openModal(`${modalHead('Restore backup')}<p class="notice" style="margin-top:14px">Restoring replaces your current library and queue. Copy a backup first if you want to keep them.</p><form id="restoreForm"><div class="field"><label for="restoreText">Paste backup code</label><textarea id="restoreText" placeholder="LK1.…" required></textarea></div><button class="btn block" type="submit">Replace my library</button></form>`);}
function restore(code){if(!code.startsWith('LK1.'))throw Error('Backup must start with LK1.');let decoded;try{decoded=decodeURIComponent(escape(atob(code.slice(4))));}catch{throw Error('The backup code is damaged or incomplete.');}let data;try{data=validate(JSON.parse(decoded));}catch{throw Error('Invalid or incompatible backup.');}if(!commit(data))return;expanded.clear();closeModal();go('home');toast('Your library was restored.');}
function ask(title,text,yes,action){openModal(`${modalHead(title)}<p class="hint" style="margin:18px 0">${esc(text)}</p><div class="actions"><button class="btn secondary" data-close="1">Cancel</button><button class="btn danger" data-confirm="${esc(action)}">${esc(yes)}</button></div>`);}
function setStatus(id,status){const i=item(id);if(!i)return;update(s=>{const b=s.series.find(x=>x.id===i.s.id)?.books.find(x=>x.id===id);if(!b)return;b.status=status;b.finishedAt=status==='finished'?new Date().toISOString():null;if(status==='listening')s.series.find(x=>x.id===i.s.id).books.forEach(x=>{if(x.id!==id&&x.status==='listening')x.status='unread';});if(status==='finished')s.queue=s.queue.filter(x=>x!==id);});toast(status==='finished'?'Finished. The next book is ready.':status==='listening'?'Enjoy the journey.':'Updated.');}
function updateQueue(id){const b=item(id)?.b;if(!b||b.status==='finished'){toast('Finished books cannot join your queue.');return;}update(s=>{if(s.queue.includes(id))s.queue=s.queue.filter(x=>x!==id);else s.queue.push(id);});}
function queueMove(id,dir){update(s=>{const q=s.queue.filter(k=>item(k)&&item(k).b.status!=='finished');const i=q.indexOf(id),j=i+(dir==='up'?-1:1);if(i<0||j<0||j>=q.length)return;[q[i],q[j]]=[q[j],q[i]];s.queue=q;});}
function orderMove(id,dir){const obj=item(id);if(!obj)return;update(s=>{const series=s.series.find(x=>x.id===obj.s.id);const arr=[...series.books].sort((a,b)=>position(a)-position(b));const i=arr.findIndex(b=>b.id===id),j=i+(dir==='up'?-1:1);if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];arr.forEach((b,k)=>b.position=String(k+1));series.books=arr;});}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){go(b.dataset.tab);return;}if(b.dataset.goto){go(b.dataset.goto);return;}if(b.dataset.statfilter){go('library',b.dataset.statfilter);return;}if(b.dataset.libraryfilter){libraryFilter=b.dataset.libraryfilter;window.scrollTo(0,0);render();return;}if(b.dataset.close){closeModal();return;}if(b.dataset.expand){const id=b.dataset.expand;expanded.has(id)?expanded.delete(id):expanded.add(id);render();return;}if(b.dataset.ownedbook){showOwnedBook(b.dataset.ownedbook);return;}if(b.dataset.togglewish){if(selectedBook)toggleWish(selectedBook);return;}if(b.dataset.unwish){update(s=>s.wishlist=s.wishlist.filter(w=>w.id!==b.dataset.unwish));return;}if(b.dataset.status){const open=$('#overlay [data-owned-modal]')?.dataset.ownedModal===b.dataset.id;setStatus(b.dataset.id,b.dataset.status);if(open)showOwnedBook(b.dataset.id);return;}if(b.dataset.setnext){const obj=item(b.dataset.setnext);if(obj)setStatus(b.dataset.setnext,obj.b.status==='listening'?'finished':'listening');return;}if(b.dataset.queue){const open=$('#overlay [data-owned-modal]')?.dataset.ownedModal===b.dataset.queue;updateQueue(b.dataset.queue);if(open)showOwnedBook(b.dataset.queue);return;}if(b.dataset.queueorder){queueMove(b.dataset.id,b.dataset.queueorder);return;}if(b.dataset.order){orderMove(b.dataset.id,b.dataset.order);return;}if(b.dataset.removebook){ask('Remove book','This will remove the book and its progress from this device.','Remove book','book:'+b.dataset.removebook);return;}if(b.dataset.removeseries){ask('Remove series','This removes every book and status in the series.','Remove series','series:'+b.dataset.removeseries);return;}if(b.dataset.confirm){const [type,id]=b.dataset.confirm.split(':');update(s=>{if(type==='series'){const old=s.series.find(x=>x.id===id);if(old)s.queue=s.queue.filter(q=>!old.books.some(b=>b.id===q));s.series=s.series.filter(x=>x.id!==id);expanded.delete(id);}else if(type==='book'){s.series.forEach(x=>x.books=x.books.filter(y=>y.id!==id));s.queue=s.queue.filter(x=>x!==id);}});closeModal();render();return;}if(b.dataset.searchtype){searchType=b.dataset.searchtype;searchResults=[];seriesResults=[];searchError='';render();return;}if(b.dataset.result!=null){const raw=searchResults[+b.dataset.result];if(raw){if(item(raw.asin))showOwnedBook(raw.asin);else showBook(raw);}return;}if(b.dataset.seriesresult!=null){const sr=seriesResults[+b.dataset.seriesresult];if(sr)importSeries(sr.asin,sr.name||'Untitled series');return;}if(b.dataset.importseries){importSeries(b.dataset.importseries,b.dataset.importname);return;}if(b.dataset.manualseries){manualSeries(b.dataset.name||'');return;}if(b.dataset.manualfrombook){const raw=selectedBook||{};manualBook(null,{title:raw.title,author:joinNames(raw.authors),narrator:joinNames(raw.narrators),position:raw.series?.[0]?.position||'',series:raw.series?.[0]?.name||'',cover:raw.imageUrl,length:raw.lengthMinutes,summary:raw.summary||raw.description,link:raw.link});return;}if(b.dataset.addmanual){manualBook(b.dataset.addmanual);return;}if(b.dataset.export){backup();return;}if(b.dataset.restore){restoreModal();return;}});
document.addEventListener('change',e=>{if(e.target.id==='seriesId'){const fresh=e.target.value==='__new__';const wrap=$('#newSeriesWrap'),input=$('#newSeriesName');if(wrap&&input){wrap.classList.toggle('hidden',!fresh);input.required=fresh;if(fresh&&!input.value)input.focus();}}});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;if(id==='searchForm'){search();return;}if(id==='seriesForm'){const name=clean($('#manualSeries').value);if(!name)return;const id='manual-'+slug();if(update(s=>s.series.unshift({id,name,author:'',createdAt:new Date().toISOString(),books:[]}))){expanded.add(id);closeModal();go('library');toast('Series created. Add its first book.');}return;}if(id==='bookForm'){
 const selected=$('#seriesId').value,newSeries=selected==='__new__',newName=clean($('#newSeriesName')?.value);
 const title=clean($('#bookTitle').value);
 if(!title)return;
 if(newSeries&&!newName){toast('Name the new series first.');$('#newSeriesName').focus();return;}
 if(!newSeries&&!store.series.some(s=>s.id===selected)){toast('Choose a valid series.');return;}
 const author=clean($('#bookAuthor').value),narrator=clean($('#bookNarrator').value),pos=clean($('#bookOrder').value);
 const extra=manualBook.pending||{};
 const sid=newSeries?'manual-'+slug():selected;
 if(update(s=>{
  if(newSeries)s.series.unshift({id:sid,name:newName,author,createdAt:new Date().toISOString(),books:[]});
  const ser=s.series.find(x=>x.id===sid);
  if(ser)ser.books.push({id:'manual-'+slug(),title,author,narrator,cover:extra.cover||'',length:extra.length||0,summary:extra.summary||'',link:extra.link||'',position:pos||String(ser.books.length+1),status:'unread',finishedAt:null,addedAt:new Date().toISOString()});
 })){
  expanded.add(sid);manualBook.pending=null;closeModal();go('library');toast(newSeries?'New series and book added.':'Book added.');
 }
 return;
}
if(id==='restoreForm'){try{restore(clean($('#restoreText').value));}catch(err){toast(err.message);}return;}});
$('#overlay').addEventListener('click',e=>{if(e.target.classList.contains('modalbg'))closeModal();});
render();
})();
</script>
</body>
