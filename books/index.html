.archive-view .archive-hero{position:relative;isolation:isolate;overflow:hidden;border-radius:20px;min-height:187px;display:flex;align-items:flex-end;padding:26px 21px 19px;margin:2px 0 16px;border:1px solid rgba(179,160,196,.33);background:#111832 var(--moonlit-art) center 42% /cover no-repeat;box-shadow:0 16px 30px #01061377}

.archive-hero-content{position:relative;text-shadow:0 2px 15px #000a}

.archive-hero p{font-size:13px;color:#e5dff2;margin-top:6px}
.discover-hero{background-position:70% 37%;}
.settings-hero{background-position:85% 35%;min-height:173px;}
.archive-search-panel,.keeper-vault{position:relative;overflow:hidden;border-radius:20px;border-color:rgba(216,181,125,.45);background:linear-gradient(145deg,rgba(32,36,71,.96),rgba(11,19,37,.98) 86%);box-shadow:0 13px 34px rgba(0,0,0,.26),inset 0 1px #ffffff12}
.archive-search-panel:before,.keeper-vault:before{content:'';position:absolute;top:-80px;right:-115px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(122,94,189,.2),transparent 70%);pointer-events:none}
.archive-search-heading,.keeper-vault-head{display:flex;align-items:center;gap:12px;position:relative}
.archive-search-sigil{display:grid;place-items:center;width:44px;height:44px;flex:none;font:30px Georgia,serif;color:#f0cb81;background:radial-gradient(circle at 50% 40%,#473758,#161c39 72%);border:1px solid rgba(232,196,132,.55);border-radius:12px;box-shadow:inset 0 0 14px #efbb5621}
.archive-search-heading h2,.keeper-vault h2{font:700 23px/1.1 Georgia,serif;color:#fff2df;margin-top:3px}
.archive-search-heading .eyebrow,.keeper-vault .eyebrow{font-size:10px;letter-spacing:.16em}
.archive-search-switch{margin:18px 0 11px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.archive-search-switch .action{min-height:44px;border-radius:11px;font-size:13px;background:#182541;color:#bec8df;border-color:#4c5b80}
.archive-search-switch .action[aria-pressed=true]{background:linear-gradient(130deg,#70522e,#3e3243);color:#ffde9d;border-color:#e0b877;box-shadow:inset 0 1px #ffdbad39}
.archive-search-form{display:flex;gap:8px;align-items:stretch;margin:0 0 10px;min-width:0}
.archive-search-form .search{min-width:0;flex:1;height:49px;border-color:#5c5775;background:rgba(9,15,32,.75);padding:0 12px}
.archive-search-form .btn{min-width:74px;min-height:49px;padding:8px 12px;white-space:nowrap}
.archive-search-panel .hint{color:#b8c0d5;font-size:12px}
.archive-empty{position:relative;margin-top:17px;overflow:hidden;padding:20px 17px 18px;border:1px solid rgba(117,138,194,.4);border-radius:19px;text-align:center;background:radial-gradient(65% 95% at 50% 0%,rgba(69,62,117,.2),transparent),linear-gradient(160deg,rgba(19,28,53,.96),rgba(7,14,31,.96))}
.archive-empty:before{content:'';position:absolute;inset:0;opacity:.12;background:var(--moonlit-art) 68% 40%/cover no-repeat;mask-image:linear-gradient(180deg,#000,transparent 90%)}
.archive-empty>*{position:relative}
.archive-empty-crest{color:#edc77e;margin:0 auto 9px;width:72px;height:72px;filter:drop-shadow(0 0 15px #ecb96129)}
.archive-empty .eyebrow{color:#b5a5d5;font-size:10px}
.archive-empty h2{font:700 25px/1.1 Georgia,serif;color:#ffedcf;margin:6px 0 7px}
.archive-empty p{max-width:320px;margin:0 auto;color:#b9c2d9;font-size:13px;line-height:1.6}
.archive-suggestions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px auto 11px}
.archive-suggestions button{border:1px solid rgba(215,182,123,.48);background:rgba(42,43,73,.73);color:#f5d9a7;border-radius:99px;font-size:12px;padding:10px 12px;min-height:41px}
.archive-suggestions button:active{background:#4a3b54}
.archive-empty .archive-manual{margin-top:3px;min-height:42px;font-size:12px}
.discover-view .section{margin:19px 0 12px}
.discover-view .section h2{font:700 23px/1.14 Georgia,serif;color:#ffedd2}
.discover-view .search-result{min-height:105px;border-radius:15px;border-color:rgba(143,133,183,.45);background:linear-gradient(130deg,#1b2646,#0c162d);box-shadow:0 9px 25px #02061250;transition:border-color .15s}
.discover-view .search-result .cover{width:67px;height:93px;border:1px solid rgba(230,198,133,.45)}
.discover-view .search-result .detail>b{font:700 18px/1.18 Georgia,serif;color:#fff1d9}
.discover-view .search-result .sigil{border-color:#bc9c62;color:#f4d18d}
.discover-view .search-result .chev{font-size:25px}
.archive-provenance{margin:21px 2px 0;padding:12px 14px 13px;border-top:1px solid #6b627050;font-size:11px;color:#98a6c4;line-height:1.6}
.keeper-vault{padding:18px}
.keeper-seal{width:48px;height:48px;flex:none;display:grid;place-items:center;color:#f4d38f;border:1px solid #aa8858;border-radius:13px;background:linear-gradient(140deg,#322c4c,#111c39);box-shadow:inset 0 0 20px #ba9c5a25}
.keeper-intro{color:#bdc6db;font-size:14px;line-height:1.6;margin:19px 0 14px}
.keeper-vault-stats{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid rgba(129,139,185,.42);background:rgba(8,14,32,.66);border-radius:13px;overflow:hidden;margin:0 0 16px}
.keeper-vault-stats>div{padding:11px 13px;display:grid;gap:3px}
.keeper-vault-stats>div+div{border-left:1px solid rgba(129,139,185,.35)}
.vault-stat-caption{font-size:10px;text-transform:uppercase;color:#a7adca;letter-spacing:.07em}
.keeper-vault-stats strong{font-size:17px;font-family:Georgia,serif;color:#f7d596;line-height:1.25}
.keeper-actions{display:grid;gap:9px}
.keeper-actions .btn{min-height:46px}
.keeper-safety{color:#a9b6d0;font-size:12px;line-height:1.55;margin-top:14px;border-top:1px solid rgba(209,183,141,.2);padding-top:13px}
.keeper-safety span{color:#e7bd79;margin-right:6px;font-size:10px}
.keeper-note{display:flex;gap:14px;align-items:flex-start;margin:19px 0 12px;border:1px solid rgba(120,140,182,.35);background:linear-gradient(130deg,#151d38,#0a142b);border-radius:18px;padding:17px}
.keeper-note-emblem{width:36px;height:36px;flex:none;display:grid;place-items:center;font:23px Georgia,serif;color:#edca83;border:1px solid #8f765a;border-radius:50%}
.keeper-note h2{font:700 21px/1.13 Georgia,serif;color:#fff0d9;margin:6px 0 9px}
.keeper-note p{font-size:13px;line-height:1.6;color:#b5bfd4}
.keeper-footer{display:flex;justify-content:center;gap:14px;color:#9c8caa;text-transform:uppercase;letter-spacing:.2em;font:11px Georgia,serif;margin:20px 0 10px}
.keeper-footer span{color:#b99663}
@media(max-width:350px){.archive-view .archive-hero{min-height:168px;padding:18px}.archive-search-panel{padding:13px}.archive-search-heading h2{font-size:21px}.archive-search-form .btn{min-width:68px}.keeper-vault{padding:14px}.archive-empty h2{font-size:22px}}
@media(prefers-reduced-motion:reduce){.discover-view .search-result{transition:none}}

/* Midnight Archive — books first, richer use of open spaces. No new dependencies. */
.shelf-section{position:relative;min-width:0;margin:10px 0 23px}
.shelf-section .section{margin:16px 0 3px}
.shelf-section .section h2{font-size:23px;color:#fff1d8}
.shelf-heading-link{border:0;background:transparent;color:#e9c788;min-height:42px;padding:4px 3px;font-size:12px;font-weight:700;white-space:nowrap}
.shelf-heading-link span{margin-left:3px}
.shelf-kicker{font-size:12px;color:#aebbd2;margin:0 0 11px;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.shelf-unread-link{flex:none;min-height:32px;padding:5px 10px;background:rgba(225,190,120,.1);color:#efcc8f;border:1px solid rgba(225,190,120,.43);border-radius:99px;font-size:12px;font-weight:700}
.shelf-unread-link:focus-visible{outline:2px solid #f8d995;outline-offset:3px}
.shelf-scroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#6d5778 transparent;padding:2px 2px 12px;margin:0 -4px 0;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.shelf-book{flex:0 0 115px;scroll-snap-align:start;min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:5px;background:linear-gradient(170deg,#19203b,#0b1429);border:1px solid rgba(171,150,131,.44);border-radius:13px;padding:8px;color:#f4ecdf;text-align:left;box-shadow:0 7px 14px #0004;font:inherit}
.shelf-book:focus-visible,.series-peek-book:focus-visible,.archive-path:focus-visible,.keeper-ledger button:focus-visible{outline:2px solid #f8d995;outline-offset:3px}
.shelf-cover{display:block;height:129px;overflow:hidden;border-radius:7px;background:#0a1023;box-shadow:0 4px 10px #01030a88}
.shelf-cover .cover{width:100%;height:100%;max-width:none;object-fit:cover;border-radius:6px}
.shelf-title{font:700 12px/1.25 Georgia,serif;min-height:30px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.shelf-status{font-size:10px;color:#b8b9d3;white-space:nowrap}
.shelf-status.is-finished{color:#f3ca82}.shelf-status.is-listening{color:#9ddfcf}
/* Collapsed series: a real peek into each volume, available without expanding. */
.tab-library .series-peek{border-top:1px solid rgba(181,148,103,.22);margin-top:12px;padding-top:12px}
.series-peek-heading{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin:0 0 9px;color:#eccb8d;letter-spacing:.04em;font:700 11px/1.3 Georgia,serif}
.series-peek-heading span:last-child{font:400 10px/1.3 system-ui,sans-serif;color:#aeb9cf;letter-spacing:0}
.series-peek-scroll{display:flex;gap:9px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#6d5778 transparent;overscroll-behavior-x:contain;scroll-snap-type:x proximity;touch-action:pan-x pan-y;padding:2px 1px 7px}
.series-peek-book{display:flex;flex:0 0 69px;flex-direction:column;gap:5px;align-items:stretch;scroll-snap-align:start;padding:0 0 5px;border:0;background:none;color:#e3deec;font:inherit;text-align:left;min-height:112px}
.tab-library .series-peek-book .cover{width:66px;height:90px;object-fit:cover;border-radius:6px;border:1px solid #b39568aa;box-shadow:0 4px 11px #0009}
.series-peek-caption{font-size:9px;line-height:1.25;max-height:26px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
/* Discover: let the paths be real author searches, supported by the user's saved covers. */
.archive-empty{display:grid;justify-items:center;gap:6px;padding:16px 17px 15px;margin-top:15px}
.archive-empty-crest{width:38px;height:40px;margin:0 0 1px;font:42px/1 Georgia,serif}
.archive-empty h2{font-size:23px;margin:4px 0 5px}
.archive-empty p{max-width:350px;font-size:12px}
.archive-suggestions{margin:7px 0 4px;gap:7px}
.archive-suggestions button{min-height:40px}
.archive-empty .archive-manual{margin-top:0}
.archive-paths{margin:18px 0 3px}
.archive-paths .section{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.archive-paths .section h2{font:700 23px/1.2 Georgia,serif;color:#ffecca}
.shelf-side-note{color:#b0b8cf;font-size:11px;white-space:nowrap}
.archive-path-list{display:grid;gap:9px}
.archive-path{position:relative;min-width:0;width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:10px;border:1px solid rgba(173,148,106,.42);border-radius:15px;background:linear-gradient(115deg,#1c2544,#0b152c);color:var(--text);font:inherit;min-height:95px;box-shadow:inset 0 1px #ffffff0a}
.archive-path:active{background:#253154}
.archive-path-cover{flex:0 0 49px;height:69px;display:block;overflow:hidden;background:#0e162d;border:1px solid #c9a87888;border-radius:5px}
.archive-path-cover .cover{width:100%;height:100%;object-fit:cover;max-width:none;border-radius:4px}
.archive-path-info{flex:1;min-width:0;display:grid;gap:3px}
.archive-path-overline{color:#c2a574;text-transform:uppercase;font-size:9px;letter-spacing:.15em;font-weight:800}
.archive-path-info strong{font:700 19px/1.18 Georgia,serif;overflow-wrap:anywhere;color:#fff0d5}
.archive-path-info small{color:#b6bfd5;font-size:11px;line-height:1.3}
.archive-path-arrow{flex:none;font:23px Georgia,serif;color:#efd091;padding:6px}
/* Keeper's ledger: actual counts and real collection covers, not decorative fake books. */
.keeper-ledger{margin:18px 0;border-radius:18px;border:1px solid rgba(173,148,106,.44);padding:17px;background:linear-gradient(145deg,rgba(27,32,62,.96),rgba(7,14,31,.98));box-shadow:0 12px 28px #02051255}
.keeper-ledger-title{display:flex;justify-content:space-between;align-items:center;gap:12px}
.keeper-ledger-title .eyebrow{font-size:9px;letter-spacing:.15em;color:#e9c489}
.keeper-ledger h2{margin-top:5px;font:700 22px/1.2 Georgia,serif;color:#fff1d9}
.keeper-ledger-mark{font:28px Georgia,serif;color:#d8b279}
.keeper-ledger-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:15px 0;border:1px solid #64739b55;border-radius:11px;background:#080e20aa}
.keeper-ledger-metrics div{display:grid;justify-items:center;gap:4px;padding:10px 3px}
.keeper-ledger-metrics div+div{border-left:1px solid #64739b55}
.keeper-ledger-metrics b{font:700 23px Georgia,serif;color:#f6d698}
.keeper-ledger-metrics span{font-size:11px;color:#b5bfd4}
.keeper-ledger-covers{display:flex;justify-content:center;gap:11px;flex-wrap:wrap}
.keeper-ledger-covers button{padding:0;border:1px solid #b69b6a66;border-radius:8px;background:#111933;min-width:50px;min-height:78px;overflow:hidden}
.keeper-ledger-covers .cover{display:block;width:52px;height:77px;object-fit:cover;border-radius:6px}
.keeper-ledger-link{display:block;margin:12px auto 0;padding:7px;color:#f6cf87;background:transparent;border:0;min-height:40px;font-weight:700;font-size:12px}
@media(max-width:350px){.shelf-book{flex-basis:105px}.shelf-cover{height:120px}.archive-path-info strong{font-size:17px}.archive-paths .section h2{font-size:20px}.shelf-side-note{font-size:10px}.keeper-ledger h2{font-size:20px}}
@media(prefers-reduced-motion:reduce){.shelf-scroll,.series-peek-scroll{scroll-behavior:auto}}


/* Unified next-adventures list: queue and automatic picks share the same cards. */
.next-adventure .row{min-width:0}
.next-adventure .book-open{min-width:0;flex:1}
.next-adventure .queue-controls{flex:none}

/* Discover: genre browsing and evidence-labeled catalog charts. */
.archive-browse{margin-top:18px;padding:18px 16px 17px;background:linear-gradient(145deg,rgba(28,35,66,.96),rgba(9,17,36,.97));border:1px solid rgba(190,161,117,.42);box-shadow:0 12px 30px #01030a66}
.archive-browse-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.archive-browse-crest{height:46px;width:46px;flex:none;display:grid;place-items:center;border:1px solid rgba(241,196,113,.6);border-radius:14px;color:#efd19b;background:linear-gradient(140deg,#332949,#111a36);font-size:26px}
.archive-browse-head h2{font:700 clamp(22px,6vw,28px)/1.12 Georgia,serif;color:#fff0d5;margin:4px 0 0}
.archive-browse-hint{font-size:12px;color:#b8c1d4;line-height:1.55;margin:4px 0 15px}
.archive-genre-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:0 0 17px}

.archive-browse-caption{font:700 11px/1.3 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#dfc18d;margin:4px 0 9px}
.archive-ranking-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.archive-ranking-tabs button{border:1px solid #53607c;background:#1a2740;color:#d2d8e6;border-radius:11px;min-height:43px;font-size:13px;font-weight:700;cursor:pointer}
.archive-ranking-tabs button[aria-pressed=true]{background:linear-gradient(145deg,#785c37,#493742);border-color:#e7c286;color:#ffebc9}
.archive-browse-foot{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.archive-browse-foot p{flex:1 1 180px;font-size:11px;line-height:1.5;color:#aeb8cf;margin:0}
.archive-chart-link{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 11px;border:1px solid #b89966;border-radius:10px;color:#f2cf91;text-decoration:none;font-size:12px;font-weight:700}
.archive-browse-results{margin-top:18px;scroll-margin-top:15px}
.archive-browse-results .section{margin:0 0 10px}
.archive-browse-results .section h2{font-size:24px}
.archive-ranking-note{font-size:11px;color:#a9b7d0;line-height:1.6;margin:0 0 12px}
.archive-rank-card{display:flex;align-items:flex-start;gap:10px;min-width:0;width:100%;padding:12px 11px;margin:0 0 9px;border-radius:16px;border:1px solid rgba(152,138,169,.4);background:linear-gradient(140deg,#1b2540,#101a32);color:#f3ece4;text-align:left;cursor:pointer}

.archive-rank-info{flex:1 1 0;min-width:0;display:grid;gap:4px}
.archive-rank-info strong{font:700 17px/1.22 Georgia,serif;overflow-wrap:anywhere}
.archive-rank-info .sub{font:12px/1.3 system-ui,sans-serif;color:#bfc6d8;margin:0}
.archive-score{font-size:12px;line-height:1.35;color:#f2ce88;font-weight:700}
.archive-more{margin-top:10px;width:100%}
.archive-browse-loading{padding:19px 14px;text-align:center;color:#dfca9e}
.archive-browse-error{padding:15px;border:1px solid rgba(231,161,143,.5);border-radius:13px;color:#f1c6bb;font-size:13px;line-height:1.5}
.archive-browse button:focus-visible,.archive-browse-results button:focus-visible,.archive-chart-link:focus-visible{outline:2px solid #f9d996;outline-offset:3px}

<script>
document.documentElement.style.setProperty('--moonlit-art',
        'url("data:image/webp;base64,' +
        document.getElementById('moonlitArtwork').textContent.replace(/\s/g, '') +
        '")');
(()=>{'use strict';
const KEY='lorekeeper.v1', API='https://libexdb.com';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s??'').trim();
const slug=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const safeUrl=v=>{try{const u=new URL(v);return u.protocol==='https:'?u.href:'';}catch{return '';}};
const joinNames=a=>Array.isArray(a)?a.map(x=>clean(typeof x==='string'?x:x&&x.name)).filter(Boolean).join(', '):clean(a);
const minutes=m=>Number.isFinite(Number(m))&&Number(m)>0?`${Math.floor(m/60)}h ${Math.round(m%60)}m`:'';
const position=b=>{const p=clean(b.position);const n=parseFloat(p);return Number.isFinite(n)?n:99999;};
const cover=(src,cls='')=>safeUrl(src)?`<img class="cover ${cls}" src="${esc(safeUrl(src))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'cover blank ${cls}',textContent:'✦'}))">`:`<span class="cover blank ${cls}" aria-hidden="true">✦</span>`;
const short=(s,n=110)=>clean(s).slice(0,n);
const stateDefault=()=>({version:1,series:[],queue:[],wishlist:[]});
function validate(data){if(!data||data.version!==1||!Array.isArray(data.series)||!Array.isArray(data.queue)||data.series.length>100||data.queue.length>3000)throw Error('Backup is not a compatible Lorekeeper backup.');for(const s of data.series){if(!s||typeof s.id!=='string'||!Array.isArray(s.books)||s.books.length>200||typeof s.name!=='string')throw Error('Invalid series in backup.');for(const b of s.books){if(!b||typeof b.id!=='string'||typeof b.title!=='string'||!['unread','listening','finished'].includes(b.status))throw Error('Invalid book in backup.');}}if(!Array.isArray(data.wishlist))data.wishlist=[];data.wishlist=data.wishlist.filter(w=>w&&typeof w.id==='string'&&typeof w.title==='string').slice(0,500);return data;}
// Existing unreadable data is protected: never replace it with an empty library.
let store=stateDefault(), storageLocked=false, rawUnreadable=null;
try{
 const saved=localStorage.getItem(KEY);
 if(saved!==null){
  try{store=validate(JSON.parse(saved));}
  catch{storageLocked=true;rawUnreadable=saved;}
 }
}catch{storageLocked=true;}
let tab='home', libraryFilter='all', expanded=new Set(), searchResults=[], seriesResults=[], selectedBook=null, searchType='books', query='', searchBusy=false, searchError='', searchNote='', awaiting=null, previewRequest=0, seriesPreview=null;
const genreChoices=[{id:'all',label:'All genres',icon:'✧',tag:''},{id:'fantasy',label:'Fantasy',icon:'✦',tag:'Fantasy'},{id:'scifi',label:'Sci-Fi',icon:'☾',tag:'Science Fiction'},{id:'mystery',label:'Mystery',icon:'⌕',tag:'Mystery'},{id:'horror',label:'Horror',icon:'♜',tag:'Horror'},{id:'romance',label:'Romance',icon:'♡',tag:'Romance'},{id:'history',label:'Historical',icon:'⌛',tag:'Historical Fiction'}];
let browseGenre='',browseSort='rating',browseResults=[],browseBusy=false,browseError='',browsePage=0,browseMore=false,browseSeq=0;
function commit(next){
 if(storageLocked){toast('Saving blocked: your unreadable saved library is protected.');return false;}
 try{localStorage.setItem(KEY,JSON.stringify(next));store=next;return true;}
 catch{toast('Could not save. Check available phone storage.');return false;}
}
function update(fn){
 if(storageLocked){toast('Saving blocked: your unreadable saved library is protected.');return false;}
 const next=typeof structuredClone==='function'?structuredClone(store):JSON.parse(JSON.stringify(store));fn(next);if(commit(next)){render();return true;}return false;
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2700);}
function bookFrom(raw,seriesAsin,seriesName){const ref=(raw.series||[]).find(x=>x.asin===seriesAsin)||{};return {id:clean(raw.asin)||slug(),title:short(raw.title||'Untitled',300),author:joinNames(raw.authors),narrator:joinNames(raw.narrators),length:Number(raw.lengthMinutes)||0,cover:safeUrl(raw.imageUrl),position:clean(ref.position)||'',status:'unread',finishedAt:null,addedAt:new Date().toISOString(),series:seriesName,summary:short(raw.summary||raw.description||'',2500),link:safeUrl(raw.link)};}
function allBooks(){return store.series.flatMap(s=>s.books.map(b=>({...b,seriesId:s.id,seriesName:s.name})));}
function nextBook(s){return [...s.books].sort((a,b)=>position(a)-position(b)).find(b=>b.status==='listening')||[...s.books].sort((a,b)=>position(a)-position(b)).find(b=>b.status!=='finished');}
function counts(){const bs=allBooks();return {series:store.series.length,done:bs.filter(b=>b.status==='finished').length,now:bs.filter(b=>b.status==='listening').length};}
function item(id){for(const s of store.series){const b=s.books.find(x=>x.id===id);if(b)return {s,b};}return null;}
function queueClean(){return store.queue.filter((id,i)=>store.queue.indexOf(id)===i&&item(id)?.b.status!=='finished'&&item(id));}
function audibleLink(b){
 const link=safeUrl(b.link);
 // Only trust a supplied Audible link when it is a real product detail page.
 // Generic links can accidentally land in search or a storefront instead.
 if(link){try{const url=new URL(link),host=url.hostname.toLowerCase();if((host==='audible.com'||host.endsWith('.audible.com'))&&/^\/pd\//i.test(url.pathname))return link;}catch{}}
 // Libex audiobook identifiers are Audible ASINs. Manual books have generated
 // IDs, so those must retain the normal title-and-author search fallback.
 const asin=clean(b.asin||b.id||'');
 if(/^[A-Z0-9]{10}$/i.test(asin))return 'https://www.audible.com/pd/'+encodeURIComponent(asin);
 return 'https://www.audible.com/search?keywords='+encodeURIComponent([b.title,b.author].filter(Boolean).join(' '));
}
function wishItem(raw){return {id:clean(raw.asin||raw.id),title:short(raw.title||'Untitled',300),author:joinNames(raw.authors)||clean(raw.author),narrator:joinNames(raw.narrators)||clean(raw.narrator),cover:safeUrl(raw.imageUrl||raw.cover),length:Number(raw.lengthMinutes||raw.length)||0,link:audibleLink({...raw,author:joinNames(raw.authors)||clean(raw.author)}),addedAt:new Date().toISOString()};}
function toggleWish(raw){const wish=wishItem(raw);if(!wish.id){toast('This book has no catalog ID.');return;}const had=store.wishlist.some(w=>w.id===wish.id);if(update(s=>{if(had)s.wishlist=s.wishlist.filter(w=>w.id!==wish.id);else s.wishlist.unshift(wish);})){toast(had?'Removed from wishlist.':'Saved to wishlist.');showBook(raw);}}
function sectionTitle(t,other=''){return `<div class="section"><h2>${esc(t)}</h2>${other}</div>`;}
function bookMini(b,subtitle=''){return `${cover(b.cover)}<div class="detail"><b>${esc(b.title)}</b><p class="sub">${esc(subtitle||b.author||'Unknown author')}</p>${b.narrator?`<div class="sub">Narrated by ${esc(b.narrator)}</div>`:''}</div>`;}
function bookCard(b,sid,index,editing=false){return `<article class="book" data-bookid="${esc(b.id)}"><button class="book-open" data-ownedbook="${esc(b.id)}" aria-label="Details for ${esc(b.title)}"><div class="row">${cover(b.cover,'tiny')}<div class="detail"><span class="order">${b.position?'BOOK '+esc(b.position):'BOOK '+(index+1)}</span><b>${esc(b.title)}</b><div class="meta">${esc(b.author||'Unknown author')}${b.narrator?` · ${esc(b.narrator)}`:''}${minutes(b.length)?` · ${minutes(b.length)}`:''}</div></div></div></button><div class="actions"><button class="action" data-status="unread" data-id="${esc(b.id)}" aria-pressed="${b.status==='unread'}">Not started</button><button class="action" data-status="listening" data-id="${esc(b.id)}" aria-pressed="${b.status==='listening'}">Listening</button><button class="action" data-status="finished" data-id="${esc(b.id)}" aria-pressed="${b.status==='finished'}">Finished</button><button class="action" data-queue="${esc(b.id)}">${store.queue.includes(b.id)?'✓ Queued':'+ Queue'}</button></div>${editing?`<div class="actions"><button class="action" data-order="up" data-id="${esc(b.id)}" ${index===0?'disabled':''}>↑ Move</button><button class="action" data-order="down" data-id="${esc(b.id)}">↓ Move</button><button class="action danger" data-removebook="${esc(b.id)}">Remove book</button></div>`:''}</article>`;}
function home(){
 const c=counts(),listening=allBooks().filter(b=>b.status==='listening'),unreadCount=allBooks().filter(b=>b.status==='unread').length;
 const next=store.series.map(s=>({s,b:nextBook(s)})).filter(x=>x.b).sort((a,b)=>a.s.name.localeCompare(b.s.name));
 const queued=queueClean().map(id=>item(id)).filter(Boolean);
 const featured=next.find(x=>x.b.status==='listening')||next[0]||null;
 // Only show additional adventures below the featured book. Queue order wins,
 // then one automatic suggestion per series; neither may appear twice.
 const seen=new Set(featured?[featured.b.id]:[]);
 const adventures=[];
 queued.forEach(({s,b},queueIndex)=>{if(!seen.has(b.id)){seen.add(b.id);adventures.push({s,b,queued:true,queueIndex});}});
 next.forEach(({s,b})=>{if(!seen.has(b.id)){seen.add(b.id);adventures.push({s,b,queued:false});}});
 const shelf=store.series.flatMap(series=>[...series.books].sort((a,b)=>position(a)-position(b)).map(b=>({...b,seriesName:series.name}))).slice(0,24);
 const statIcon={series:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h5v15H4zM11 4h4v16h-4zM17 5h3v15h-3z"/></svg>',finished:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m7.5 12 3.2 3.2 5.8-6"/></svg>',listening:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14V12a8 8 0 0 1 16 0v2M4 14v5a2 2 0 0 0 2 2h2v-9H6a2 2 0 0 0-2 2Zm16 0v5a2 2 0 0 1-2 2h-2v-9h2a2 2 0 0 1 2 2Z"/></svg>'};
 return `<div class="home-view"><header class="home-head"><div class="home-brand"><div class="home-emblem" aria-hidden="true">L</div><div><h1>The Lorekeeper</h1><div class="eyebrow">Your listening journal</div></div></div></header>
 <section class="home-feature"><div class="eyebrow">${featured?(featured.b.status==='listening'?'Your current adventure':'Your next adventure'):'A library of worlds'}</div>
 ${featured?`<div class="home-feature-row"><div class="home-feature-cover">${cover(featured.b.cover)}</div><div class="detail"><h2>${esc(featured.b.title)}</h2><p class="sub">${esc(featured.s.name)}</p>${featured.b.narrator?`<p class="sub">Narrated by ${esc(featured.b.narrator)}</p>`:''}<span class="pill feature-secondary">${featured.b.status==='listening'?'Listening':'Next in series'}</span></div></div><div class="home-feature-actions"><button class="btn primary-action" ${featured.b.status==='listening'?`data-ownedbook="${esc(featured.b.id)}"`:`data-setnext="${esc(featured.b.id)}"`}>${featured.b.status==='listening'?'Book details':'Mark listening'} →</button><a class="btn ghost home-audible-link" href="${esc(audibleLink(featured.b))}" rel="noopener noreferrer" aria-label="Open ${esc(featured.b.title)} on Audible">Open Audible ↗</a></div>`:`<h2 style="margin:15px 0 9px">Your next great adventure awaits.</h2><p class="hint" style="margin-bottom:14px">${c.series?'All tracked series are finished. Explore something new.':'Search for a series, add its books, and keep your place through every adventure.'}</p><button class="btn primary-action" data-goto="discover">Find a series →</button>`}</section>
 <div class="stats"><button class="stat" data-statfilter="all" aria-label="Show all ${c.series} series"><span class="stat-icon">${statIcon.series}</span><strong>${c.series}</strong><span>Series</span></button><button class="stat" data-statfilter="finished" aria-label="Show ${c.done} finished books"><span class="stat-icon">${statIcon.finished}</span><strong>${c.done}</strong><span>Finished</span></button><button class="stat" data-statfilter="listening" aria-label="Show ${c.now} listening books"><span class="stat-icon">${statIcon.listening}</span><strong>${c.now}</strong><span>Listening</span></button></div>
 ${shelf.length?`<section class="shelf-section" aria-label="Your library shelf">${sectionTitle('Your bookshelf',`<button class="shelf-heading-link" data-goto="library">${shelf.length} ${shelf.length===1?'book':'books'} on display <span aria-hidden="true">→</span></button>`)}<p class="shelf-kicker"><span>Your adventures, bound together. Swipe to browse.</span><button class="shelf-unread-link" type="button" data-statfilter="unread" aria-label="Show ${unreadCount} unread books">${unreadCount} unread →</button></p><div class="shelf-scroll" aria-label="Browse saved books">${shelf.map(b=>`<button type="button" class="shelf-book" data-ownedbook="${esc(b.id)}" aria-label="Open ${esc(b.title)} details"><span class="shelf-cover">${cover(b.cover)}</span><span class="shelf-title">${esc(b.title)}</span><span class="shelf-status ${b.status==='finished'?'is-finished':b.status==='listening'?'is-listening':''}">${b.status==='finished'?'✦ Finished':b.status==='listening'?'● Listening':b.position?'Book '+esc(b.position):'Not started'}</span></button>`).join('')}</div></section>`:''}
 ${adventures.length?`${sectionTitle('Your next adventures',`<button class="btn ghost small" data-goto="library">All series →</button>`)}
 <div class="stack">${adventures.map(({s,b,queued:inQueue,queueIndex})=>`<div class="panel next-adventure"><div class="row"><button class="book-open" data-ownedbook="${esc(b.id)}" aria-label="Details for ${esc(b.title)}"><div class="row">${bookMini(b,s.name)}</div></button>${inQueue?`<div class="queue-controls"><button data-queueorder="up" data-id="${esc(b.id)}" ${queueIndex===0?'disabled':''} aria-label="Move earlier">↑</button><button data-queueorder="down" data-id="${esc(b.id)}" ${queueIndex===queued.length-1?'disabled':''} aria-label="Move later">↓</button></div>`:''}</div><div class="actions"><span class="pill ${inQueue?'listening':''}">${inQueue?'Queued · '+(queueIndex+1):'Next in series'}</span><button class="action" data-setnext="${esc(b.id)}">${b.status==='listening'?'Mark finished':'Start listening'}</button>${inQueue?`<button class="action danger" data-queue="${esc(b.id)}">Remove from queue</button>`:''}</div></div>`).join('')}</div>`:''}
 ${sectionTitle('Wishlist',`<button class="btn ghost small" data-goto="discover">Find books →</button>`)}${store.wishlist.length?`<div class="stack">${store.wishlist.map(w=>`<div class="panel"><a class="wish-link" href="${esc(audibleLink(w))}" target="_blank" rel="noopener noreferrer" aria-label="Find ${esc(w.title)} on Audible">${bookMini(w,w.author)}<span class="wish-arrow">Audible ↗</span></a><div class="actions"><button class="action danger" data-unwish="${esc(w.id)}">Remove from wishlist</button></div></div>`).join('')}</div>`:`<div class="empty">Save an audiobook from Discover. Tap a wishlist book to find it on Audible.</div>`}</div>`;}
function library(){
 const chosen=libraryFilter;
 const filters=`<div class="library-filters" aria-label="Library view"><button class="library-filter" data-libraryfilter="all" aria-pressed="${chosen==='all'}">All series</button><button class="library-filter" data-libraryfilter="unread" aria-pressed="${chosen==='unread'}">Unread</button><button class="library-filter" data-libraryfilter="finished" aria-pressed="${chosen==='finished'}">Finished</button><button class="library-filter" data-libraryfilter="listening" aria-pressed="${chosen==='listening'}">Listening</button></div>`;
 const heading=chosen==='finished'?'Finished books':chosen==='listening'?'Currently listening':chosen==='unread'?'Unread books':'My series';
 const top=`<div class="top"><div><div class="eyebrow">Your collection</div><h1>${heading}</h1></div><button class="iconbtn" data-goto="discover" aria-label="Search and add series">+</button></div>${filters}`;
 if(chosen!=='all'){
  const books=allBooks().filter(b=>b.status===chosen).sort((a,b)=>chosen==='finished'?(Date.parse(b.finishedAt||0)-Date.parse(a.finishedAt||0)):(a.seriesName.localeCompare(b.seriesName)||position(a)-position(b)));
  return `${top}${books.length?`<p class="hint">${books.length} ${chosen==='finished'?'finished':chosen==='unread'?'not started':'in progress'} · Tap any book for its details.</p><div class="stack" style="margin-top:17px">${books.map(b=>`<div class="panel"><button class="book-open" data-ownedbook="${esc(b.id)}" aria-label="Details for ${esc(b.title)}"><div class="row">${bookMini(b,b.seriesName)}</div><div class="sub" style="margin-top:8px">${b.position?'Book '+esc(b.position)+' · ':''}${chosen==='finished'?'Finished':chosen==='unread'?'Not started':'Listening'} →</div></button></div>`).join('')}</div>`:`<div class="empty"><strong>${chosen==='finished'?'No finished audiobooks yet.':chosen==='unread'?'No unread books.':'Nothing currently listening.'}</strong>Use the Series tab to change a book's status.<button class="btn secondary" style="margin-top:14px" data-libraryfilter="all">Show all series</button></div>`}`;
 }
 return `${top}${store.series.length?`<p class="hint">Tap a series to view its books, track progress, and correct the order when needed.</p><div class="stack" style="margin-top:17px">${store.series.map(s=>{const done=s.books.filter(b=>b.status==='finished').length,show=expanded.has(s.id);const sorted=[...s.books].sort((a,b)=>position(a)-position(b));return `<section class="panel series"><button class="series-head" data-expand="${esc(s.id)}" aria-expanded="${show}">${cover(s.books.find(x=>x.cover)?.cover)}<div class="detail"><h3>${esc(s.name)}</h3><p class="sub">${done} of ${s.books.length} finished${s.author?` · ${esc(s.author)}`:''}</p><div class="series-progress" role="progressbar" aria-label="Series completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${s.books.length?Math.round(done/s.books.length*100):0}"><span style="width:${s.books.length?Math.round(done/s.books.length*100):0}%"></span></div><span class="pill series-progress-label">${s.books.length?Math.round(done/s.books.length*100):0}% complete</span></div><span class="chev">${show?'⌃':'⌄'}</span></button>${!show&&sorted.length>1?`<div class="series-peek"><div class="series-peek-heading"><span>Inside this world</span><span>${sorted.length} ${sorted.length===1?'book':'books'} · tap a cover</span></div><div class="series-peek-scroll" aria-label="Books from ${esc(s.name)}">${sorted.slice(0,6).map(b=>`<button class="series-peek-book" data-ownedbook="${esc(b.id)}" aria-label="Details for ${esc(b.title)}">${cover(b.cover,'tiny')}<span class="series-peek-caption">${b.status==='finished'?'✓ ':''}${esc(b.title)}</span></button>`).join('')}</div></div>`:''}${show?`<div class="series-books">${sorted.map((b,i)=>bookCard(b,s.id,i,true)).join('')}<button class="btn secondary block" data-addmanual="${esc(s.id)}">+ Add a missing book</button><button class="btn ghost block" data-removeseries="${esc(s.id)}">Remove this series</button></div>`:''}</section>`;}).join('')}</div>`:`<div class="empty" style="margin-top:20px"><strong>Your library is waiting.</strong>Find an audiobook and add its entire series in one tap.<button class="btn block" style="margin-top:16px" data-goto="discover">Discover series</button></div>`}`;

function discover(){
 const hasResults=searchType==='books'?searchResults.length>0:seriesResults.length>0;
 const paths=[];const authorsSeen=new Set();
 for(const series of store.series){
  const author=clean(series.author||series.books.find(b=>b.author)?.author||'');
  if(!author||authorsSeen.has(author.toLowerCase()))continue;
  authorsSeen.add(author.toLowerCase());
  paths.push({name:author,series:series.name,cover:series.books.find(b=>b.cover)?.cover||''});
  if(paths.length===3)break;
 }
 const suggestions=`<div class="archive-suggestions" aria-label="Example searches"><button data-quicksearch="Robin Hobb" data-quicktype="books">Robin Hobb</button><button data-quicksearch="The Blade Itself" data-quicktype="books">The Blade Itself</button><button data-quicksearch="Realm of the Elderlings" data-quicktype="series">Realm of the Elderlings</button></div>`;
 const intro=`<section class="archive-empty" aria-label="Search inspiration"><div class="archive-empty-crest" aria-hidden="true">✧</div><div><div class="eyebrow">A thousand worlds await</div><h2>Choose a path into another world</h2><p>Start with an author, book, or series. Every path searches the real audiobook catalog.</p></div>${suggestions}<button class="btn ghost small archive-manual" data-manualseries="1">Create a series by hand →</button></section>
 ${paths.length?`<section class="archive-paths"><div class="section"><h2>From your shelves</h2><span class="shelf-side-note">Explore your authors</span></div><div class="archive-path-list">${paths.map(p=>`<button class="archive-path" data-quicksearch="${esc(p.name)}" data-quicktype="books" aria-label="Search more audiobooks by ${esc(p.name)}"><span class="archive-path-cover">${cover(p.cover)}</span><span class="archive-path-info"><span class="archive-path-overline">Follow the author</span><strong>${esc(p.name)}</strong><small>From ${esc(p.series)}</small></span><span class="archive-path-arrow" aria-hidden="true">↗</span></button>`).join('')}</div></section>`:''}`;
 const browseActive=Boolean(browseGenre);
 const browseControls=`<section class="panel archive-browse" aria-label="Explore audiobook genres"><div class="archive-browse-head"><div class="archive-browse-crest" aria-hidden="true">✦</div><div><div class="eyebrow">Explore the archives</div><h2>Browse by genre</h2></div></div><p class="archive-browse-hint">Discover real audiobooks from the catalog. Choose a shelf and a ranking.</p><div class="archive-genre-grid">${genreChoices.map(g=>`<button type="button" class="archive-genre" data-browsegenre="${g.id}" aria-pressed="${browseGenre===g.id}"><span class="genre-mark" aria-hidden="true">${g.icon}</span><span>${g.label}</span></button>`).join('')}</div><div class="archive-browse-caption">Find the best of the shelf</div><div class="archive-ranking-tabs" role="group" aria-label="Catalog ranking"><button type="button" data-browsesort="rating" aria-pressed="${browseSort==='rating'}">★ Top Rated</button><button type="button" data-browsesort="new" aria-pressed="${browseSort==='new'}">◷ New Releases</button></div><div class="archive-browse-foot"><p>Top Rated uses Libex catalog ratings, not sales. Genres may overlap.</p><a class="archive-chart-link" href="https://www.audible.com/charts/best" target="_blank" rel="noopener noreferrer">Audible bestsellers ↗</a></div></section>`;
 const selectedGenre=genreChoices.find(x=>x.id===browseGenre);
 const browseItems=browseResults.map((b,i)=>{const rating=Number(b.rating),ratings=Number(b.numRatings),validRating=Number.isFinite(rating)&&rating>0;const info=browseSort==='rating'?`${validRating?'★ '+rating.toFixed(1):'Rating unavailable'}${Number.isFinite(ratings)&&ratings>0?' · '+ratings.toLocaleString('en-US')+' ratings':''}`:`${b.releaseDate?'Released '+b.releaseDate:'Release date not listed'}${validRating?' · ★ '+rating.toFixed(1):''}`;return `<button type="button" class="archive-rank-card" data-browsebook="${i}" aria-label="Details for ${esc(b.title||'Untitled')}"><span class="archive-rank-number">${(i+1)}</span>${cover(b.imageUrl)}<span class="archive-rank-info"><strong>${esc(b.title||'Untitled')}</strong><span class="sub">${esc(joinNames(b.authors)||'Author unknown')}</span><span class="archive-score">${esc(info)}</span>${b.series?.[0]?.name?`<span class="sub">${esc(b.series[0].name)}</span>`:''}</span></button>`;}).join('');
 const browseSection=browseActive?`<section class="archive-browse-results" aria-label="Genre catalog results">${sectionTitle(`${esc(selectedGenre?.label||'All genres')} · ${browseSort==='rating'?'Top Rated':'New Releases'}`)}<p class="archive-ranking-note">${browseSort==='rating'?'Ranked by catalog rating (ties by number of ratings), from indexed results. A high rating with few reviews is less certain.':'Recently released audiobooks from Libex’s indexed catalog. Dates and availability may vary.'} ${browseResults.length?`${browseResults.length} shown.`:''}</p>${browseItems}${browseBusy?'<div class="archive-browse-loading" role="status">Opening the archive…</div>':''}${browseError?`<div class="archive-browse-error" role="alert">${esc(browseError)} <button class="btn small secondary" style="margin-top:10px" data-browseretry="1">Try again</button></div>`:''}${!browseBusy&&!browseError&&!browseResults.length?'<div class="empty">Nothing found for this shelf and ranking. Try another genre or Top Rated.</div>':''}${!browseBusy&&browseMore?'<button class="btn secondary block archive-more" data-browsemore="1">More from this shelf ↓</button>':''}</section>`:'';
 const results=searchType==='books'&&searchResults.length?sectionTitle(`${searchResults.length} audiobook results`)+`<div class="stack archive-results">${searchResults.map((b,i)=>`<button class="search-result" data-result="${i}">${cover(b.imageUrl)}<div class="detail"><b>${esc(b.title||'Untitled')}</b><p class="sub">${esc(joinNames(b.authors)||'Author unknown')}</p><p class="sub">${esc(joinNames(b.narrators)||'Narrator not listed')}${minutes(b.lengthMinutes)?` · ${minutes(b.lengthMinutes)}`:''}</p>${b.series?.length?`<span class="pill">${esc(b.series[0].name||'Series available')}${b.series[0].position?' · Book '+esc(b.series[0].position):''}</span>`:''}</div><span class="chev">›</span></button>`).join('')}</div>`:searchType==='series'&&seriesResults.length?sectionTitle(`${seriesResults.length} matching series`)+`<div class="stack archive-results">${seriesResults.map((s,i)=>`<button class="search-result" data-seriesresult="${i}"><span class="sigil" aria-hidden="true">✦</span><div class="detail"><b>${esc(s.name)}</b><p class="sub">Preview all books before adding</p></div><span class="chev">›</span></button>`).join('')}</div>`:browseActive?'':intro;
 return `<div class="archive-view discover-view">
 <header class="archive-hero discover-hero"><div class="archive-hero-content"><div class="eyebrow">Beyond the known pages</div><h1>Discover</h1><p>Find the next world worth getting lost in.</p></div></header>
 <section class="panel archive-search-panel"><div class="archive-search-heading"><span class="archive-search-sigil" aria-hidden="true">✧</span><div><div class="eyebrow">The catalog of worlds</div><h2>Seek a story</h2></div></div><div class="archive-search-switch" role="group" aria-label="Search by"><button class="action" data-searchtype="books" aria-pressed="${searchType==='books'}">Audiobooks</button><button class="action" data-searchtype="series" aria-pressed="${searchType==='series'}">Series names</button></div><form id="searchForm" class="archive-search-form"><input id="query" class="search" type="search" enterkeyhint="search" spellcheck="false" autocorrect="off" placeholder="${searchType==='books'?'Book title or author':'Series name'}" value="${esc(query)}" aria-label="Search ${searchType==='books'?'audiobooks':'series'}" required minlength="2"><button class="btn" type="submit">Find <span aria-hidden="true">→</span></button></form><p class="hint">${searchType==='books'?'Find an audiobook, preview its series, then decide what to add.':'Search directly for a series and preview its reading order.'}</p></section>
 ${searchBusy?`<div class="statusmsg" role="status">Searching the audiobook catalog…</div>`:''}${searchNote&&!searchError?`<div class="notice" style="margin-top:14px" role="status">${esc(searchNote)}</div>`:''}${searchError?`<div class="notice" style="margin-top:14px;color:var(--red)" role="alert">${esc(searchError)}<div style="margin-top:10px"><button class="btn small ghost" data-manualseries="1">Add a series manually</button></div></div>`:''}
 ${!hasResults&&!searchBusy&&!searchError?browseControls:''}
 ${!searchBusy&&!searchError?hasResults?results:(browseActive?browseSection:results):''}
 ${hasResults?'<button type="button" class="btn ghost block" style="margin-top:15px" data-clearsearch="1">← Browse genres</button>':''}
 <p class="archive-provenance">Catalog information comes from independent Libex data, not an official Audible connection. Titles, editions and series order may need correction. Your library stays on this device.</p></div>`;
}

 return `<div class="archive-view settings-view"><header class="archive-hero settings-hero"><div class="archive-hero-content"><div class="eyebrow">The keeper's study</div><h1>Settings & backup</h1><p>Keep your worlds safe.</p></div></header>

 const match=ss.find(s=>named&&s.name.toLowerCase()===named.toLowerCase());
 const target=ss.some(s=>s.id===id)?id:(match?.id||'__new__');
 const opts=ss.map(s=>`<option value="${esc(s.id)}" ${s.id===target?'selected':''}>${esc(s.name)}</option>`).join('');
 const newOne=target==='__new__';
 openModal(`${modalHead('Add a book')}<form id="bookForm"><div class="field"><label for="seriesId">Series</label><select id="seriesId">${opts}<option value="__new__" ${newOne?'selected':''}>＋ Create a new series</option></select></div><div class="field ${newOne?'':'hidden'}" id="newSeriesWrap"><label for="newSeriesName">New series name</label><input id="newSeriesName" maxlength="180" value="${esc(named)}" placeholder="e.g. The Licanius Trilogy" ${newOne?'required':''}></div><div class="field"><label for="bookTitle">Title</label><input id="bookTitle" maxlength="250" required value="${esc(defaults.title||'')}"></div><div class="field"><label for="bookAuthor">Author (optional)</label><input id="bookAuthor" maxlength="200" value="${esc(defaults.author||'')}"></div><div class="field"><label for="bookNarrator">Narrator (optional)</label><input id="bookNarrator" maxlength="200" value="${esc(defaults.narrator||'')}"></div><div class="field"><label for="bookOrder">Series position</label><input id="bookOrder" maxlength="12" value="${esc(defaults.position||'')}"></div><button class="btn block" type="submit">Add audiobook</button></form>`);
 // Remember book metadata from Discover without writing any data until Save.
 manualBook.pending={cover:safeUrl(defaults.cover),length:Number(defaults.length)||0,summary:short(defaults.summary||'',2500),link:safeUrl(defaults.link)};
}
function copyRawData(){
 if(rawUnreadable===null){toast('Saved data is not accessible to copy.');return;}
 const ok=()=>toast('Raw saved data copied. Keep it safe in Notes.');
 if(navigator.clipboard?.writeText)navigator.clipboard.writeText(rawUnreadable).then(ok,()=>backupFallback(rawUnreadable,true));
 else backupFallback(rawUnreadable,true);
}
function backup(){
 if(storageLocked){copyRawData();return;}
 const code='LK1.'+btoa(unescape(encodeURIComponent(JSON.stringify(store))));const ok=()=>toast('Backup copied. Save it in Notes.');
 if(navigator.clipboard?.writeText)navigator.clipboard.writeText(code).then(ok,()=>backupFallback(code));else backupFallback(code);
}
function backupFallback(code,raw=false){openModal(`${modalHead(raw?'Copy raw saved data':'Copy your backup')}<p class="hint" style="margin:13px 0">${raw?'This is the exact unreadable saved data, not a normal backup code. Select all and copy it somewhere safe.':'Select all and copy this code to Notes.'}</p><textarea id="backupText" class="search" style="height:140px;resize:vertical" readonly>${esc(code)}</textarea>`);$('#backupText').select();}
function restoreModal(){openModal(`${modalHead('Restore backup')}<p class="notice" style="margin-top:14px">Restoring replaces your current library and queue. Copy a backup first if you want to keep them.</p><form id="restoreForm"><div class="field"><label for="restoreText">Paste backup code</label><textarea id="restoreText" placeholder="LK1.…" required></textarea></div><button class="btn block" type="submit">Replace my library</button></form>`);}
function restore(code){if(!code.startsWith('LK1.'))throw Error('Backup must start with LK1.');let decoded;try{decoded=decodeURIComponent(escape(atob(code.slice(4))));}catch{throw Error('The backup code is damaged or incomplete.');}let data;try{data=validate(JSON.parse(decoded));}catch{throw Error('Invalid or incompatible backup.');}if(!commit(data))return;expanded.clear();closeModal();go('home');toast('Your library was restored.');}
function ask(title,text,yes,action){openModal(`${modalHead(title)}<p class="hint" style="margin:18px 0">${esc(text)}</p><div class="actions"><button class="btn secondary" data-close="1">Cancel</button><button class="btn danger" data-confirm="${esc(action)}">${esc(yes)}</button></div>`);}
function setStatus(id,status){const i=item(id);if(!i)return;update(s=>{const b=s.series.find(x=>x.id===i.s.id)?.books.find(x=>x.id===id);if(!b)return;b.status=status;b.finishedAt=status==='finished'?new Date().toISOString():null;if(status==='listening')s.series.find(x=>x.id===i.s.id).books.forEach(x=>{if(x.id!==id&&x.status==='listening')x.status='unread';});if(status==='finished')s.queue=s.queue.filter(x=>x!==id);});toast(status==='finished'?'Finished. The next book is ready.':status==='listening'?'Enjoy the journey.':'Updated.');}
function updateQueue(id){const b=item(id)?.b;if(!b||b.status==='finished'){toast('Finished books cannot join your queue.');return;}update(s=>{if(s.queue.includes(id))s.queue=s.queue.filter(x=>x!==id);else s.queue.push(id);});}
function queueMove(id,dir){update(s=>{const q=s.queue.filter(k=>item(k)&&item(k).b.status!=='finished');const i=q.indexOf(id),j=i+(dir==='up'?-1:1);if(i<0||j<0||j>=q.length)return;[q[i],q[j]]=[q[j],q[i]];s.queue=q;});}
function orderMove(id,dir){const obj=item(id);if(!obj)return;update(s=>{const series=s.series.find(x=>x.id===obj.s.id);const arr=[...series.books].sort((a,b)=>position(a)-position(b));const i=arr.findIndex(b=>b.id===id),j=i+(dir==='up'?-1:1);if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];arr.forEach((b,k)=>b.position=String(k+1));series.books=arr;});}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){go(b.dataset.tab);return;}if(b.dataset.goto){go(b.dataset.goto);return;}if(b.dataset.statfilter){go('library',b.dataset.statfilter);return;}if(b.dataset.libraryfilter){libraryFilter=b.dataset.libraryfilter;window.scrollTo(0,0);render();return;}if(b.dataset.close){closeModal();return;}if(b.dataset.previewbook!=null){showPreviewBook(Number(b.dataset.previewbook));return;}if(b.dataset.backpreview){renderSeriesPreview();return;}if(b.dataset.expand){const id=b.dataset.expand;expanded.has(id)?expanded.delete(id):expanded.add(id);render();return;}if(b.dataset.ownedbook){showOwnedBook(b.dataset.ownedbook);return;}if(b.dataset.togglewish){if(selectedBook)toggleWish(selectedBook);return;}if(b.dataset.unwish){update(s=>s.wishlist=s.wishlist.filter(w=>w.id!==b.dataset.unwish));return;}if(b.dataset.status){const open=$('#overlay [data-owned-modal]')?.dataset.ownedModal===b.dataset.id;setStatus(b.dataset.id,b.dataset.status);if(open)showOwnedBook(b.dataset.id);return;}if(b.dataset.setnext){const obj=item(b.dataset.setnext);if(obj)setStatus(b.dataset.setnext,obj.b.status==='listening'?'finished':'listening');return;}if(b.dataset.queue){const open=$('#overlay [data-owned-modal]')?.dataset.ownedModal===b.dataset.queue;updateQueue(b.dataset.queue);if(open)showOwnedBook(b.dataset.queue);return;}if(b.dataset.queueorder){queueMove(b.dataset.id,b.dataset.queueorder);return;}if(b.dataset.order){orderMove(b.dataset.id,b.dataset.order);return;}if(b.dataset.removebook){ask('Remove book','This will remove the book and its progress from this device.','Remove book','book:'+b.dataset.removebook);return;}if(b.dataset.removeseries){ask('Remove series','This removes every book and status in the series.','Remove series','series:'+b.dataset.removeseries);return;}if(b.dataset.confirm){const [type,id]=b.dataset.confirm.split(':');update(s=>{if(type==='series'){const old=s.series.find(x=>x.id===id);if(old)s.queue=s.queue.filter(q=>!old.books.some(b=>b.id===q));s.series=s.series.filter(x=>x.id!==id);expanded.delete(id);}else if(type==='book'){s.series.forEach(x=>x.books=x.books.filter(y=>y.id!==id));s.queue=s.queue.filter(x=>x!==id);}});closeModal();render();return;}if(b.dataset.browsegenre){chooseGenre(b.dataset.browsegenre);return;}if(b.dataset.browsesort){changeBrowseSort(b.dataset.browsesort);return;}if(b.dataset.browsemore){browseCatalog(true);return;}if(b.dataset.browseretry){browseCatalog(browsePage>0);return;}if(b.dataset.browsebook!=null){const raw=browseResults[Number(b.dataset.browsebook)];if(raw){if(item(raw.asin))showOwnedBook(raw.asin);else showBook(raw);}return;}if(b.dataset.clearsearch){searchResults=[];seriesResults=[];query='';searchError='';searchNote='';render();return;}if(b.dataset.quicksearch){searchType=b.dataset.quicktype==='series'?'series':'books';query=b.dataset.quicksearch;searchResults=[];seriesResults=[];searchError='';searchNote='';render();search();return;}if(b.dataset.searchtype){searchType=b.dataset.searchtype;searchResults=[];seriesResults=[];searchError='';searchNote='';render();return;}if(b.dataset.result!=null){const raw=searchResults[+b.dataset.result];if(raw){if(item(raw.asin))showOwnedBook(raw.asin);else showBook(raw);}return;}if(b.dataset.seriesresult!=null){const sr=seriesResults[+b.dataset.seriesresult];if(sr)previewSeries(sr.asin,sr.name||'Untitled series');return;}if(b.dataset.previewseries){previewSeries(b.dataset.previewseries,b.dataset.previewname);return;}if(b.dataset.importseries){importSeries(b.dataset.importseries,b.dataset.importname);return;}if(b.dataset.manualseries){manualSeries(b.dataset.name||'');return;}if(b.dataset.manualfrombook){const raw=selectedBook||{};manualBook(null,{title:raw.title,author:joinNames(raw.authors),narrator:joinNames(raw.narrators),position:raw.series?.[0]?.position||'',series:raw.series?.[0]?.name||'',cover:raw.imageUrl,length:raw.lengthMinutes,summary:raw.summary||raw.description,link:raw.link});return;}if(b.dataset.addmanual){manualBook(b.dataset.addmanual);return;}if(b.dataset.copyraw){copyRawData();return;}if(b.dataset.export){backup();return;}if(b.dataset.restore){restoreModal();return;}});
document.addEventListener('change',e=>{if(e.target.id==='seriesId'){const fresh=e.target.value==='__new__';const wrap=$('#newSeriesWrap'),input=$('#newSeriesName');if(wrap&&input){wrap.classList.toggle('hidden',!fresh);input.required=fresh;if(fresh&&!input.value)input.focus();}}});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;if(id==='searchForm'){search();return;}if(id==='seriesForm'){const name=clean($('#manualSeries').value);if(!name)return;const id='manual-'+slug();if(update(s=>s.series.unshift({id,name,author:'',createdAt:new Date().toISOString(),books:[]}))){expanded.add(id);closeModal();go('library');toast('Series created. Add its first book.');}return;}if(id==='bookForm'){
 const selected=$('#seriesId').value,newSeries=selected==='__new__',newName=clean($('#newSeriesName')?.value);
 const title=clean($('#bookTitle').value);
 if(!title)return;
 if(newSeries&&!newName){toast('Name the new series first.');$('#newSeriesName').focus();return;}
 if(!newSeries&&!store.series.some(s=>s.id===selected)){toast('Choose a valid series.');return;}
 const author=clean($('#bookAuthor').value),narrator=clean($('#bookNarrator').value),pos=clean($('#bookOrder').value);
 const extra=manualBook.pending||{};
 const sid=newSeries?'manual-'+slug():selected;
 if(update(s=>{
  if(newSeries)s.series.unshift({id:sid,name:newName,author,createdAt:new Date().toISOString(),books:[]});
  const ser=s.series.find(x=>x.id===sid);
  if(ser)ser.books.push({id:'manual-'+slug(),title,author,narrator,cover:extra.cover||'',length:extra.length||0,summary:extra.summary||'',link:extra.link||'',position:pos||String(ser.books.length+1),status:'unread',finishedAt:null,addedAt:new Date().toISOString()});
 })){
  expanded.add(sid);manualBook.pending=null;closeModal();go('library');toast(newSeries?'New series and book added.':'Book added.');
 }
 return;
}
if(id==='restoreForm'){try{restore(clean($('#restoreText').value));}catch(err){toast(err.message);}return;}});
$('#overlay').addEventListener('click',e=>{if(e.target.classList.contains('modalbg'))closeModal();});
render();
})();
</script>
